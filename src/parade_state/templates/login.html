<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Parade State Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 1rem;
            padding: 2.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }

        .login-button {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: background-color 0.2s;
            width: 100%;
        }

        .login-button:hover {
            background-color: #1d4ed8;
        }

        .info {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #f3f4f6;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: #6b7280;
        }

        .info p {
            margin-bottom: 0.5rem;
        }

        .info p:last-child {
            margin-bottom: 0;
        }

        /* Environment banner (mirrors base.html; shown only when
           ENVIRONMENT_BANNER is set — never in production). */
        .env-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 1.5rem;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f59e0b;
            color: #111827;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
        }

        body.env-banner {
            padding-top: 1.5rem;
        }
    </style>
</head>
<body class="{% if request.app.state.settings.ENVIRONMENT_BANNER %}env-banner{% endif %}">
    {% if request.app.state.settings.ENVIRONMENT_BANNER %}
    <div class="env-banner" role="note">{{ request.app.state.settings.ENVIRONMENT_BANNER | e }}</div>
    {% endif %}
    <div class="login-container">
        <div class="logo">🎖️</div>
        <h1>Parade State Admin</h1>
        <p class="subtitle">Sign in to access the admin interface</p>

        <a href="/auth/oauth/start" class="login-button">Sign in with Google</a>

        <div class="info">
            <p><strong>System Information:</strong></p>
            <p>Battalion parade state management system</p>
            <p>Contact: System Administrator</p>
        </div>
    </div>
</body>
</html>
