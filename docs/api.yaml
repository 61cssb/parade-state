# OpenAPI 3 spec for the Parade State REST API (/api/v1).
# Web/admin page routes are documented in ENDPOINTS.md (HTML, not JSON).
# Kept deliberately terse: one-line summaries, x-access-control role
# annotations, and schemas only for the main payloads. All response
# fields are snake_case.

openapi: 3.1.0

info:
  title: Parade State Management System API
  version: 0.1.0
  description: |
    Battalion parade state management with access control.

    ## Identity (issue 31)
    Caller identity is session-derived on every endpoint: the HttpOnly
    session cookie set by the Google OAuth callback, or the same DB-backed
    token as a Bearer header. No endpoint accepts identity from query
    params or bodies; provenance (`created_by`, `updated_by`, ...) is
    stamped server-side. Role is re-read from the database per request.
    Missing/invalid session → 401; below the endpoint's role tier or
    outside scope grants → 403.

    ## Roles
    Vocabulary is `super_admin` / `admin` / `user` (there is no `scoped`
    role). `x-access-control` values: `authenticated` (any active user),
    `admin` (admin or super_admin), `super_admin`.

    ## Feature gating
    Env kill switches (`FEATURE_ATTENDANCE`, `FEATURE_NOMINALROLL`,
    `FEATURE_GROUPING`, `FEATURE_DEFERMENTS`, `FEATURE_DISCUSSIONS`,
    `FEATURE_STRENGTH`): flag-off answers **404** with
    `{"detail": "This feature is not available on this deployment
    (FEATURE_X=false)"}` for every role. The issue-37 feature-access
    matrix additionally **403**s the `admin` role off
    attendance/nominal-roll/grouping data when toggled off in Settings
    (super_admins bypass).

    ## Scope grants (issues 4, 28)
    `UserSubunitAssignment` grants are (unit, sub_unit_1) pairs per
    nominal roll with the explicit `*` wildcard. Reads/writes are checked
    against the *effective* location (the NR's 1:1 tagging overlay). No
    grants on an NR → 403 (deny-by-default); `super_admin` bypasses.

    ## Conventions
    Responses are snake_case. Pagination is `skip`/`limit` or
    `limit`/`offset` — never page/pageSize.

    ## Removed surfaces
    The user-managed session model is gone: **every** `/api/v1/sessions/*`
    path answers 410 Gone (see `/sessions/{path}`). Attendance is taken
    once daily against the NR active for attendance — see
    `/attendance/`. The CSV mapping/diff/confirm pipeline, column
    mappings, column sensitivity, the access levels API, settings API and
    the attendance SSE stream were also removed; CSV ingestion is the
    2-step upload/process flow under `/csv`.

servers:
  - url: /
    description: Same origin; API paths are prefixed /api/v1

tags:
  - name: auth
  - name: users
  - name: sessions
  - name: attendance
  - name: personnel
  - name: nominal-rolls
  - name: taggings
  - name: deferments
  - name: discussions
  - name: access-control
  - name: csv-upload
  - name: groupings
  - name: audit
  - name: admin

paths:
  # =========================================================================
  # Auth
  # =========================================================================
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user info.
      x-access-control: authenticated
      responses:
        "200":
          description: Session user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  email: {type: string}
                  name: {type: string}
                  role: {type: string, enum: [super_admin, admin, user]}
                  status: {type: string}
                  access_level_id: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the caller's session token (Bearer required).
      x-access-control: authenticated
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}

  # =========================================================================
  # Users
  # =========================================================================
  /api/v1/users/:
    get:
      tags: [users]
      summary: List users with filtering (admin tier).
      x-access-control: admin
      parameters:
        - {name: skip, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: search, in: query, schema: {type: string}, description: Substring match on email/name.}
        - {name: status_filter, in: query, schema: {type: string}}
        - {name: role_filter, in: query, schema: {type: string}}
      responses:
        "200":
          description: Paginated users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: {$ref: "#/components/schemas/UserListItem"}
                  total_count: {type: integer}
                  skip: {type: integer}
                  limit: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [users]
      summary: Pre-register a user before their first Google sign-in.
      description: The account is created `active`, so the OAuth callback matches the email and issues a session immediately.
      x-access-control: super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserCreate"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserMutationResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/users/{user_id}:
    get:
      tags: [users]
      summary: Get one user.
      description: Users may view themselves; admin tier may view anyone; otherwise 403.
      x-access-control: authenticated
      parameters:
        - {$ref: "#/components/parameters/UserId"}
      responses:
        "200":
          description: User with sign-in timestamps.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/UserMutationResponse"}
                  - type: object
                    properties:
                      created_at: {type: string, format: date-time}
                      first_sign_in_at: {type: [string, "null"], format: date-time}
                      last_sign_in_at: {type: [string, "null"], format: date-time}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    patch:
      tags: [users]
      summary: Update name/status/role/access_level_id.
      description: >
        Admin tier. Any change targeting a `super_admin` account, or
        granting `role: super_admin`, is super-admin-only (403 for plain
        admins). Promoting to super_admin/admin also activates an
        `unrecognised`/`pending` account. Audited.
      x-access-control: admin
      parameters:
        - {$ref: "#/components/parameters/UserId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserUpdate"}
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserMutationResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      tags: [users]
      summary: Delete a user.
      description: Super-admin only (admins get 403); self-deletion is refused with 400. Audited.
      x-access-control: super_admin
      parameters:
        - {$ref: "#/components/parameters/UserId"}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  # =========================================================================
  # Sessions (removed — 410 stub)
  # =========================================================================
  /api/v1/sessions/{path}:
    get:
      tags: [sessions]
      summary: Removed surface.
      description: >
        Any method (GET/POST/PATCH/PUT/DELETE) on any /api/v1/sessions/*
        path answers 410 Gone — the user-managed session model was
        removed (single daily attendance on the active NR).
      x-access-control: none
      parameters:
        - {name: path, in: path, required: true, schema: {type: string}}
      responses:
        "410":
          description: Gone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Sessions have been removed. Attendance is taken once daily and scoped to a Nominal Roll / Tagging. See /api/v1/attendance/.

  # =========================================================================
  # Attendance (FEATURE_ATTENDANCE + matrix "attendance")
  # =========================================================================
  /api/v1/attendance/:
    get:
      tags: [attendance]
      summary: Attendance rows for an NR on a date.
      description: Scope-filtered (effective unit/sub_unit_1); no grants on the NR → 403. Rows missing from the response should be rendered as the Absent default.
      x-access-control: admin
      x-feature-flag: FEATURE_ATTENDANCE
      parameters:
        - {name: nominal_roll_id, in: query, required: true, schema: {type: string}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Attendance rows (scope-filtered).
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AttendanceResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/attendance/upsert:
    put:
      tags: [attendance]
      summary: Bulk upsert keyed on (personnel_id, date).
      description: >
        Only the NR active for attendance is writable (400 otherwise).
        Frozen dates are super-admin-writable — others get 403 naming the
        freeze. Each target personnel must be on the NR and inside the
        caller's scope. Retroactive edits (date < today UTC) stamp
        `is_retroactive_edit`.
      x-access-control: admin
      x-feature-flag: FEATURE_ATTENDANCE
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AttendanceBulkUpsert"}
      responses:
        "200":
          description: Upserted rows.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AttendanceResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/attendance/copy-remarks:
    post:
      tags: [attendance]
      summary: Copy remarks from one date to another.
      description: >
        Roster = all active NR personnel, optionally narrowed to an
        effective sub_unit_1, intersected with the caller's write scope.
        Frozen destination date → super-admin only. Blank source remarks
        leave the destination untouched; missing destination rows are
        created (status absent). Dates must differ (400).
      x-access-control: admin
      x-feature-flag: FEATURE_ATTENDANCE
      parameters:
        - {name: nominal_roll_id, in: query, required: true, schema: {type: string}}
        - {name: source_date, in: query, required: true, schema: {type: string, format: date}}
        - {name: dest_date, in: query, required: true, schema: {type: string, format: date}}
        - {name: sub_unit_1, in: query, schema: {type: string}}
      responses:
        "200":
          description: Copy counts.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CopyRemarksResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/attendance/freeze:
    put:
      tags: [attendance]
      summary: Freeze an (NR, date) — day-level write lock.
      description: Only the attendance-active NR can be frozen; already frozen → 409. Frozen days stay editable by super-admins, read-only for admins. Audited.
      x-access-control: super_admin
      x-feature-flag: FEATURE_ATTENDANCE
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AttendanceFreezeRequest"}
      responses:
        "200":
          description: Freeze state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AttendanceFreezeResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [attendance]
      summary: Unfreeze an (NR, date).
      description: Same key passed as query params (DELETE bodies are unreliable). Not frozen → 404.
      x-access-control: super_admin
      x-feature-flag: FEATURE_ATTENDANCE
      parameters:
        - {name: nominal_roll_id, in: query, required: true, schema: {type: string}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
      responses:
        "200":
          description: Freeze state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AttendanceFreezeResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/attendance/export:
    get:
      tags: [attendance]
      summary: CSV of the marking table exactly as displayed.
      description: Columns Unit, Sub-unit 1-3, Category, Rank, Name, Inpro Status, Status, Reason, Remarks. Unmarked roster members export as Absent. Scope-filtered.
      x-access-control: admin
      x-feature-flag: FEATURE_ATTENDANCE
      parameters:
        - {name: nominal_roll_id, in: query, required: true, schema: {type: string}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: sub_unit_1, in: query, schema: {type: string}}
      responses:
        "200":
          description: text/csv attachment.
          content:
            text/csv:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  # =========================================================================
  # Personnel (matrix "nominal_roll")
  # =========================================================================
  /api/v1/personnel:
    get:
      tags: [personnel]
      summary: List personnel with filters, sorting, pagination.
      description: >
        super_admin lists everything; admins see only NRs they hold grants
        on, filtered to their effective scope before pagination. Without a
        named NR, admins get only grant-holding NRs.
      x-access-control: admin
      parameters:
        - {name: nominal_roll_id, in: query, schema: {type: string}}
        - {name: unit, in: query, schema: {type: string}}
        - {name: sub_unit_1, in: query, schema: {type: string}}
        - {name: sub_unit_2, in: query, schema: {type: string}}
        - {name: sub_unit_3, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [active, archived]}}
        - {name: category, in: query, schema: {type: string, enum: [Officer, WOSE]}}
        - {name: search, in: query, schema: {type: string}, description: Name or pers_no substring.}
        - {name: sort_by, in: query, schema: {type: string, enum: [name, rank, unit, status, created_at, updated_at]}}
        - {name: sort_order, in: query, schema: {type: string, enum: [asc, desc]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: Personnel list (scope-filtered for admins).
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PersonnelResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [personnel]
      summary: Manually add a serviceman to an NR.
      description: 'source="manual". Category is inferred from rank (400 on unknown rank); pers_no optional (per-roll unique, 409 on duplicate). Manual adds live only on this roll.'
      x-access-control: super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PersonnelCreate"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PersonnelResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/personnel/{personnel_id}:
    get:
      tags: [personnel]
      summary: Get one serviceman.
      description: Effective (unit, sub_unit_1) must be inside the caller's scope.
      x-access-control: admin
      parameters:
        - {$ref: "#/components/parameters/PersonnelId"}
      responses:
        "200":
          description: Personnel (effective values).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PersonnelResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    patch:
      tags: [personnel]
      summary: Update status / remarks / subunit remaps.
      description: >
        The NR is read-only: `rank`/`name` → 409. `unit`/`sub_unit_1`
        remaps, `pers_no` and `inpro_status` are super-admin-only (403 for
        admins, checked before the scope gate — a mixed payload is
        rejected whole). In-scope admins may remap `sub_unit_2` /
        `sub_unit_3` (recorded on the tagging overlay) and edit `status`
        / `remarks`. Duplicate pers_no on the roll → 409.
      x-access-control: admin
      parameters:
        - {$ref: "#/components/parameters/PersonnelId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PersonnelUpdate"}
      responses:
        "200":
          description: Personnel (effective values).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PersonnelResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/personnel/{personnel_id}/attendance-history:
    get:
      tags: [personnel]
      summary: Per-day attendance with summary stats.
      description: Single daily session rows, newest first; scope-gated. `nominal_roll_id` must match the personnel's NR when supplied (400).
      x-access-control: admin
      parameters:
        - {$ref: "#/components/parameters/PersonnelId"}
        - {name: nominal_roll_id, in: query, schema: {type: string}}
        - {name: date_from, in: query, schema: {type: string, format: date}}
        - {name: date_to, in: query, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: History page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AttendanceHistoryResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  # =========================================================================
  # Nominal rolls (FEATURE_NOMINALROLL + matrix "nominal_roll")
  # =========================================================================
  /api/v1/nominal-rolls:
    get:
      tags: [nominal-rolls]
      summary: List NRs (summary rows, newest upload first).
      description: super_admin sees every NR; admins only NRs they hold a grant on.
      x-access-control: admin
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: NR summaries.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/NominalRollListItem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/nominal-rolls/{nominal_roll_id}:
    get:
      tags: [nominal-rolls]
      summary: One NR with activation stamps.
      x-access-control: admin
      parameters:
        - {$ref: "#/components/parameters/NominalRollId"}
      responses:
        "200":
          description: NR detail.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NominalRollResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    patch:
      tags: [nominal-rolls]
      summary: Update notes / label / remarks.
      description: Needs at least one scope grant for admins; label is globally unique (409 otherwise).
      x-access-control: admin
      parameters:
        - {$ref: "#/components/parameters/NominalRollId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NominalRollUpdate"}
      responses:
        "200":
          description: NR detail.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NominalRollResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [nominal-rolls]
      summary: Delete an NR and cascade its data.
      description: Super-admin only. Refused (400) while groupings reference the roll — delete those first.
      x-access-control: super_admin
      parameters:
        - {$ref: "#/components/parameters/NominalRollId"}
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/nominal-rolls/{nominal_roll_id}/activate-attendance:
    post:
      tags: [nominal-rolls]
      summary: Mark this NR the one active for attendance.
      description: Auto-deactivates any other active NR. Attendance writes are only permitted against the active NR.
      x-access-control: super_admin
      parameters:
        - {$ref: "#/components/parameters/NominalRollId"}
      responses:
        "200":
          description: NR detail.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NominalRollResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/nominal-rolls/{nominal_roll_id}/deactivate-attendance:
    post:
      tags: [nominal-rolls]
      summary: Clear the active-for-attendance flag.
      description: Idempotent; the activation stamp is kept as history.
      x-access-control: super_admin
      parameters:
        - {$ref: "#/components/parameters/NominalRollId"}
      responses:
        "200":
          description: NR detail.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NominalRollResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/nominal-rolls/{nominal_roll_id}/export:
    get:
      tags: [nominal-rolls]
      summary: CSV of the NR browser table (no row cap).
      description: Columns Unit, Sub Unit 1-3, Category, Rank, Full Name, Pers No, Inpro Status, Remarks; tagging overlay applied; filters honoured; scope-filtered.
      x-access-control: admin
      parameters:
        - {$ref: "#/components/parameters/NominalRollId"}
        - {name: search, in: query, schema: {type: string}}
        - {name: unit, in: query, schema: {type: string}}
        - {name: sub_unit_1, in: query, schema: {type: string}}
        - {name: sub_unit_2, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: rank, in: query, schema: {type: string}}
        - {name: inpro_status, in: query, schema: {type: string, enum: [inproed, yet_to_inpro, deferred]}}
      responses:
        "200":
          description: text/csv attachment.
          content:
            text/csv:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  # =========================================================================
