openapi: 3.1.0

info:
  title: Parade State Management System API
  version: 0.1.0
  description: |
    API for the Battalion Parade State Management System.

    ## Authentication
    All endpoints (except `/auth/*`) require a valid session cookie obtained via Google OAuth.
    Session cookies are `HttpOnly`, `Secure`, `SameSite=Strict`.

    ## Access control
    Two enforcement dimensions applied on every data endpoint:
    - **Row visibility**: user sees only personnel rows covered by their subunit scope grants for the requested grouping.
    - **Column visibility**: response includes only columns whose sensitivity label is met by the user's access level.
      The `columns` manifest on list endpoints is always pre-scoped — clients render headers from the manifest, never from hardcoded column names.

    Admin and super_admin roles bypass both dimensions and see all rows and columns.

    ## Column manifest pattern (Option C)
    Endpoints returning personnel data include a `columns` array alongside `rows`.
    `columns` lists only the fields the requesting user may see, in display order.
    `rows` objects contain only those keys. Clients must not infer anything from absent keys.

    ## Stale detection (SSE)
    `GET /events/attendance` is a Server-Sent Events stream. The server emits a
    `data_changed` event whenever any attendance record within the user's current
    grouping+session scope is updated by another user. The client shows a Refresh
    prompt on receipt; it does not apply updates automatically.

servers:
  - url: /api/v1

# =============================================================================
# TAGS (endpoint groups)
# =============================================================================

tags:
  - name: auth
    description: Google OAuth flow and session management
  - name: db-restore
    description: >
      Super-admin database restore from a decrypted backup dump
      (verify-then-swap; see docs/BACKUP_SETUP.md)
  - name: admin-purge
    description: >
      Testing-only super-admin purge of all Nominal Rolls and downstream
      data (gated by PURGE_ENABLED; off in production by default)
  - name: users
    description: User account management (admin)
  - name: access-levels
    description: Ordered access level vocabulary (admin)
  - name: subunit-enums
    description: Valid values for unit/subunit hierarchy levels (admin)
  - name: csv-upload
    description: CSV estab upload pipeline — upload, mapping, diff, confirm
  - name: column-mappings
    description: Global raw→canonical column mapping table (admin)
  - name: column-metadata
    description: Per-CSV-version column registry and sensitivity labels (admin)
  - name: groupings
    description: >
      Grouping lifecycle — create, clone, migrate, activate.
      Feature-flagged: every /api/v1/groupings/* route returns 404 for
      all roles (super-admins included) unless FEATURE_GROUPING=true
      (on in development, off in production).
  - name: grouping-overrides
    description: Personnel subunit overrides within a grouping
  - name: grouping-notes
    description: Grouping-scoped persistent notes per personnel
  - name: sessions
    description: >
      DEPRECATED (issue #4). Sessions were removed — AM/PM are now hardcoded
      slots on Attendance rows. All /api/v1/sessions/* routes
      return 410 Gone. Retained here as a signpost; detailed paths below are
      stale and will be pruned in a follow-up.
  - name: attendance
    description: >
      Attendance with hardcoded AM/PM slots, taken against the Nominal Roll
      currently active for attendance (with its 1:1 tagging applied). Bulk
      upsert and copy-remarks; writes require the target NR to be the active
      one (400 otherwise) and are gated by Subunit-1 assignment (403;
      super_admin bypasses; tagging-aware effective sub_unit_1).
  - name: nominal-rolls
    description: >
      Nominal Roll management. Super-admin attendance activation:
      exactly one NR is active for attendance at a time (auto-switch on
      activate). The NR confirm/unconfirm workflow is removed.
  - name: subunit-assignments
    description: >
      NR-scoped Subunit-1 attendance access (issue #4 PR 2). Super-admin-only
      CRUD granting users attendance-update rights per sub_unit_1 on an NR.
      Managed under /api/v1/access-control/...
  - name: app-settings
    description: Runtime application settings (admin)
  - name: audit-log
    description: Append-only audit trail (admin)
  - name: events
    description: Server-Sent Events for stale data detection
  - name: deferments
    description: >
      Personnel deferments — super-admin only; drives callup_status.
      Feature-flagged: every /api/v1/deferments/* route returns 404 for
      all roles (super-admins included) unless FEATURE_DEFERMENTS=true
      (on in development, off in production).
  - name: taggings
    description: Tagging overlays — super-admin only; person→subunit remappings on a Nominal Roll (1:1 with the NR)
  - name: csv
    description: CSV upload and processing into Nominal Rolls

# =============================================================================
# PATHS
# =============================================================================

paths:

  # ---------------------------------------------------------------------------
  # ADMIN — database restore
  # ---------------------------------------------------------------------------

  /admin/database/restore:
    post:
      tags: [db-restore]
      summary: Restore the application database from a dump archive
      description: |
        Super-admin only (403 otherwise). Accepts a multipart upload of a
        decrypted pg_dump custom-format file (the operator decrypts the
        `.dump.age` backup offline; the server never sees age keys) plus a
        `confirmation` query parameter that must equal the current database
        name. Restore flow: validate archive (pg_restore --list, version
        guard) → restore into a temporary database → verify (known alembic
        revision not newer than the build's head, core tables present) →
        swap by renaming databases → re-initialize the engine → migrate if
        the dump was older than head → audit-log. The live database is
        untouched until verification passes. 409 if another restore is in
        flight; 400 when `RESTORE_ENABLED=false`, on SQLite deployments,
        or on any verification failure (with the live DB unchanged).
      parameters:
        - name: confirmation
          in: query
          required: true
          schema: { type: string }
          description: Must equal the current database name
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: pg_dump custom-format archive, max 25 MB
      responses:
        "200":
          description: Restore completed; body is the verification summary
        "400":
          description: Gating or verification failure (live DB unchanged)
        "403":
          description: Caller is not a super admin
        "409":
          description: Another restore is already in progress

  # ---------------------------------------------------------------------------
  # ADMIN — data purge (testing-only)
  # ---------------------------------------------------------------------------

  /admin/purge:
    post:
      tags: [admin-purge]
      summary: Delete all Nominal Rolls and downstream data (testing-only)
      description: |
        Super-admin only (403 otherwise). Deletes every Nominal Roll and all
        downstream data — personnel, attendance, deferments, taggings,
        groupings (with overrides/exclusions/notes/access grants),
        column metadata, CSV uploads, and NR-bound subunit assignments —
        in one transaction, so CSV upload can be re-tested from a clean
        slate. Preserved: users, access levels, sessions, global column
        mappings, and the audit log (the purge itself is recorded there
        as entity_type=database, action=delete, with per-table counts).
        Requires `confirmation=PURGE` (exact match) and `PURGE_ENABLED`
        on the deployment (default off in production, on elsewhere).
        Returns per-table deleted-row counts.
      parameters:
        - name: confirmation
          in: query
          required: true
          schema: { type: string }
          description: Must equal PURGE
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Purge completed; body includes purged_counts per table
        "400":
          description: Wrong confirmation text or PURGE_ENABLED=false
        "403":
          description: Caller is not a super admin

  # ---------------------------------------------------------------------------
  # NOMINAL ROLLS — attendance activation
  # ---------------------------------------------------------------------------

  /nominal-rolls/{nominalRollId}/activate-attendance:
    post:
      tags: [nominal-rolls]
      summary: Mark an NR as the one active for attendance (auto-switch)
      description: |
        Super-admin only. Deactivates any other currently-active NR in the
        same action, then marks this NR active with an audit stamp
        (`attendance_activated_at`/`_by`). Attendance writes are only
        permitted against the active NR, with its 1:1 tagging applied.
      parameters:
        - name: nominalRollId
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
      responses:
        '200':
          description: The updated nominal roll (attendance_active = true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NominalRollResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /nominal-rolls/{nominalRollId}/deactivate-attendance:
    post:
      tags: [nominal-rolls]
      summary: Deactivate attendance for this NR
      description: |
        Super-admin only. Clears `attendance_active` (the activation stamp is
        kept as history). With no active NR, the attendance view shows an
        inactive message and writes are refused (400).
      parameters:
        - name: nominalRollId
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
      responses:
        '200':
          description: The updated nominal roll (attendance_active = false)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NominalRollResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # AUTH
  # ---------------------------------------------------------------------------

  /auth/google:
    get:
      tags: [auth]
      summary: Initiate Google OAuth flow
      description: Redirects to Google's OAuth consent screen. No session required.
      security: []
      responses:
        '302':
          description: Redirect to Google

  /auth/google/callback:
    get:
      tags: [auth]
      summary: Google OAuth callback
      description: |
        Handles the OAuth callback from Google. Admin-only system.
        - If email matches SUPER_ADMIN_EMAIL env var → create/update user as
          active super_admin, create session, redirect to `/admin`.
        - If email matches an existing active admin → create session,
          redirect to `/admin`.
        - If email is suspended → 403 (no session).
        - Otherwise (unknown email, or non-admin account) → auto-register as
          `unrecognised` (unknown emails only), render the no-access page
          with 403, and create no session. A super-admin promotes the user
          to admin via `PATCH /users/{userId}`.
      security: []
      responses:
        '302':
          description: Redirect to /admin with session cookie set
        '403':
          description: Not an active admin (no-access page), or account suspended (JSON error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/session:
    get:
      tags: [auth]
      summary: Get current session
      description: Returns the authenticated user's profile and effective permissions.
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/signout:
    post:
      tags: [auth]
      summary: Sign out
      description: Destroys the session cookie.
      responses:
        '204':
          description: Signed out
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # USERS
  # ---------------------------------------------------------------------------

  /users:
    get:
      tags: [users]
      summary: List users
      x-access-control: admin
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, suspended, unrecognised]
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [users]
      summary: Preregister a user account
      x-access-control: super_admin
      description: |
        Creates a user before their first Google sign-in (super admins only).
        The email is lowercased so the OAuth callback's exact-match lookup
        finds the row; the account is created `active`, so the first sign-in
        works immediately without the usual `unrecognised` holding state.
        Replaces the earlier auto-register-and-promote flow for accounts
        that must be ready before the person ever visits the site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'
    get:
      tags: [users]
      summary: Get user
      x-access-control: admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [users]
      summary: Update user (role, status, access level)
      x-access-control: admin
      description: |
        Writable fields: `role`, `status`, `access_level_id`.
        Promoting a user to `super_admin`/`admin` while `unrecognised` (or
        legacy `pending`) also sets `status=active`; explicitly suspended
        users stay suspended until separately reactivated.
        Suspending a user immediately invalidates their active sessions.
        Writes `user.access_updated` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/grouping-grants:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'
    get:
      tags: [users]
      summary: List grouping grants for user
      x-access-control: admin
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserGroupingGrant'
    put:
      tags: [users]
      summary: Replace grouping grants for user
      x-access-control: admin
      description: Full replacement. Writes `user.access_updated` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupingIds]
              properties:
                groupingIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserGroupingGrant'

  /users/{userId}/subunit-grants:
    parameters:
      - $ref: '#/components/parameters/UserIdParam'
    get:
      tags: [users]
      summary: List subunit scope grants for user
      x-access-control: admin
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSubunitGrant'
    put:
      tags: [users]
      summary: Replace subunit scope grants for user
      x-access-control: admin
      description: Full replacement. Writes `user.access_updated` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grants]
              properties:
                grants:
                  type: array
                  items:
                    $ref: '#/components/schemas/SubunitGrantInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSubunitGrant'

  # ---------------------------------------------------------------------------
  # ACCESS LEVELS
  # ---------------------------------------------------------------------------

  /access-levels:
    get:
      tags: [access-levels]
      summary: List access levels (ordered, ascending by level_order)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessLevel'
    post:
      tags: [access-levels]
      summary: Create access level
      x-access-control: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessLevelInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessLevel'
        '409':
          description: Label or level_order already in use

  /access-levels/{accessLevelId}:
    parameters:
      - name: accessLevelId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [access-levels]
      summary: Update access level label or order
      x-access-control: admin
      description: |
        Relabelling auto-migrates all references (column sensitivity_label,
        user access_level_id) to the new label string.
        Writes `access_level.updated` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessLevelInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessLevel'
    delete:
      tags: [access-levels]
      summary: Deprecate access level
      x-access-control: admin
      description: |
        Soft-delete only. Returns 409 if any active user or non-deprecated column
        references this level.
      responses:
        '204':
          description: Deprecated
        '409':
          description: Level is still in use

  # ---------------------------------------------------------------------------
  # SUBUNIT ENUMS
  # ---------------------------------------------------------------------------

  /subunit-enums:
    get:
      tags: [subunit-enums]
      summary: List all subunit enum values grouped by level
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  unit:
                    type: array
                    items: { type: string }
                  sub_unit_1:
                    type: array
                    items: { type: string }
                  sub_unit_2:
                    type: array
                    items: { type: string }
                  sub_unit_3:
                    type: array
                    items: { type: string }

    post:
      tags: [subunit-enums]
      summary: Add enum value
      x-access-control: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, value]
              properties:
                level:
                  type: integer
                  minimum: 0
                  maximum: 3
                value:
                  type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubunitEnumValue'
        '409':
          description: Value already exists at that level

  /subunit-enums/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [subunit-enums]
      summary: Deprecate enum value
      x-access-control: admin
      description: Soft-delete. Returns 409 if value is referenced by any non-archived personnel snapshot.
      responses:
        '204':
          description: Deprecated
        '409':
          description: Value still in use

  # ---------------------------------------------------------------------------
  # CSV UPLOAD PIPELINE
  # ---------------------------------------------------------------------------

  /csv-uploads:
    get:
      tags: [csv-upload]
      summary: List CSV uploads (estabs)
      x-access-control: admin
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CsvUploadSummary'

    post:
      tags: [csv-upload]
      summary: Upload a new CSV estab file
      x-access-control: admin
      description: |
        Step 1 of 3 in the upload pipeline.
        Accepts multipart form data. Parses header row, computes content hash,
        stores raw CSV, attempts auto-matching against global column_mappings table.
        Returns status `pending_mapping` with the mapping resolution UI payload.
        Writes `csv.upload_started` to audit log.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, caaDate]
              properties:
                file:
                  type: string
                  format: binary
                caaDate:
                  type: string
                  format: date
                  description: Correct-as-at date for this upload
      responses:
        '201':
          description: Upload received; mapping review required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvUploadMappingPayload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A confirmed CSV already exists with this CAA date

  /csv-uploads/{uploadId}/mapping:
    parameters:
      - $ref: '#/components/parameters/UploadIdParam'
    get:
      tags: [csv-upload]
      summary: Get mapping resolution payload for an upload
      x-access-control: admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvUploadMappingPayload'
    post:
      tags: [csv-upload]
      summary: Confirm column mappings
      x-access-control: admin
      description: |
        Step 2 of 3. Admin submits resolved mappings for all columns.
        Required canonical columns must all be mapped.
        Conflicting mappings (raw name previously mapped to different canonical)
        must be explicitly confirmed.
        Updates global column_mappings table.
        Triggers diff computation against most recent confirmed CSV.
        Returns status `pending_diff` with diff payload.
        Writes `csv.mapping_confirmed` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmMappingsRequest'
      responses:
        '200':
          description: Mappings confirmed; diff ready for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvDiffPayload'
        '400':
          description: Required column(s) still unmapped or conflicts unresolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingValidationError'
        '409':
          description: Upload is not in pending_mapping status

  /csv-uploads/{uploadId}/diff:
    parameters:
      - $ref: '#/components/parameters/UploadIdParam'
    get:
      tags: [csv-upload]
      summary: Get diff payload for an upload in pending_diff status
      x-access-control: admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvDiffPayload'

  /csv-uploads/{uploadId}/confirm:
    parameters:
      - $ref: '#/components/parameters/UploadIdParam'
    post:
      tags: [csv-upload]
      summary: Confirm and commit the upload
      x-access-control: admin
      description: |
        Step 3 of 3. Admin confirms the diff.
        - Populates personnel_snapshots from parsed CSV.
        - Archives leavers (persons present in the prior estab but not in the new one, matched by pers_no).
        - Creates estab grouping linked to this CSV.
        - Transfers notes from the prior active grouping by following each person across estabs via pers_no (persons are matched on pers_no, the external personnel number).
        - Marks prior confirmed CSV as `superseded`.
        - Sets this upload status to `confirmed`.
        Writes `csv.diff_confirmed` and `grouping.created` to audit log.
      responses:
        '200':
          description: Upload committed; estab grouping created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvConfirmResult'
        '409':
          description: Upload is not in pending_diff status

  /csv-uploads/{uploadId}:
    parameters:
      - $ref: '#/components/parameters/UploadIdParam'
    get:
      tags: [csv-upload]
      summary: Get CSV upload details
      x-access-control: admin
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvUploadDetail'

  # ---------------------------------------------------------------------------
  # COLUMN MAPPINGS (global table)
  # ---------------------------------------------------------------------------

  /column-mappings:
    get:
      tags: [column-mappings]
      summary: List all column mappings
      x-access-control: admin
      parameters:
        - name: includeDeprecated
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnMapping'

  /column-mappings/{mappingId}:
    parameters:
      - name: mappingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [column-mappings]
      summary: Update a column mapping
      x-access-control: admin
      description: |
        Admin-editable at any time. Applies to future uploads only; not retroactive.
        Writes `column_mapping.updated` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                canonicalName:
                  type: string
                deprecated:
                  type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnMapping'

  # ---------------------------------------------------------------------------
  # COLUMN METADATA (per CSV version)
  # ---------------------------------------------------------------------------

  /csv-uploads/{uploadId}/columns:
    parameters:
      - $ref: '#/components/parameters/UploadIdParam'
    get:
      tags: [column-metadata]
      summary: List column metadata for a CSV version
      x-access-control: admin
      description: Used by the sensitivity label configuration screen.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnMetadata'

  /csv-uploads/{uploadId}/columns/{columnId}/sensitivity:
    parameters:
      - $ref: '#/components/parameters/UploadIdParam'
      - name: columnId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [column-metadata]
      summary: Update column sensitivity label
      x-access-control: admin
      description: |
        Takes effect immediately for all active sessions.
        null sensitivityLabel = admin-only.
        Writes `column_sensitivity.updated` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sensitivityLabel:
                  type: string
                  nullable: true
                  description: Access level label, or null for admin-only
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnMetadata'

  # ---------------------------------------------------------------------------
  # GROUPINGS
  # ---------------------------------------------------------------------------

  /groupings:
    get:
      tags: [groupings]
      summary: List groupings visible to current user
      description: |
        Admins see all groupings.
        Scoped users see only groupings for which they have a grant.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, inactive, archived]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupingSummary'

    post:
      tags: [groupings]
      summary: Create grouping
      x-access-control: admin
      description: |
        Creates a `draft` grouping. Validates that valid_from/valid_until does not
        overlap any existing draft or active grouping (returns 409 if conflict).
        Writes `grouping.created` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupingRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grouping.'
        '409':
          description: Date range overlaps an existing draft or active grouping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupingOverlapError'

  /groupings/{groupingId}:
    parameters:
      - $ref: '#/components/parameters/GroupingIdParam'
    get:
      tags: [groupings]
      summary: Get grouping details
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grouping.'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [groupings]
      summary: Update grouping
      x-access-control: admin
      description: |
        Writable fields: `name`, `valid_from`, `valid_until`, `scheduled_activation`.
        valid_from/valid_until changes are rejected if they would create an overlap or
        if any existing sessions would fall outside the new date range.
        Writes `grouping.updated` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupingRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grouping.'
        '409':
          description: Date range overlap or grouping not in editable state

  /groupings/{groupingId}/activate:
    parameters:
      - $ref: '#/components/parameters/GroupingIdParam'
    post:
      tags: [groupings]
      summary: Manually activate a grouping
      x-access-control: admin
      description: |
        Transitions grouping to `active`. Moves current active grouping to `inactive`.
        Validates no date range overlap with currently active grouping.
        Writes `grouping.activated` and `grouping.deactivated` to audit log.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grouping.'
        '409':
          description: Overlap conflict or grouping already active/archived

  /groupings/{groupingId}/clone:
    parameters:
      - $ref: '#/components/parameters/GroupingIdParam'
    post:
      tags: [groupings]
      summary: Clone a grouping (same-estab)
      x-access-control: admin
      description: |
        Creates a new `draft` grouping from the same estab.
        Copies personnel assignment overrides.
        Name is prefixed "Copy of …" by default (overridable in request).
        valid_from/valid_until are unset in the clone (must be provided before activation).
        transferNotes: if true, copies grouping_notes to the new grouping.
        Writes `grouping.cloned` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneGroupingRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grouping.'

  /groupings/{groupingId}/migrate:
    parameters:
      - $ref: '#/components/parameters/GroupingIdParam'
    post:
      tags: [groupings]
      summary: Begin cross-estab migration
      x-access-control: admin
      description: |
        Step 1 of 2. Computes the diff between the source grouping's estab and
        the target estab. Returns a resolution payload for admin review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetCsvUploadId]
              properties:
                targetCsvUploadId:
                  type: string
                  format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrateResolutionPayload'
        '400':
          description: Target CSV is not in confirmed status

  /groupings/{groupingId}/migrate/confirm:
    parameters:
      - $ref: '#/components/parameters/GroupingIdParam'
    post:
      tags: [groupings]
      summary: Confirm cross-estab migration
      x-access-control: admin
      description: |
        Step 2 of 2. Admin submits resolved assignments for joiners and dismissed leavers.
        Creates a new draft grouping against the target estab.
        Writes `grouping.migrated` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateConfirmRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grouping.'
        '400':
          description: Unresolved joiners (missing unit assignments) or undismissed leavers

  # ---------------------------------------------------------------------------
  # GROUPING PERSONNEL OVERRIDES
  # ---------------------------------------------------------------------------

  /groupings/{groupingId}/overrides:
    parameters:
      - $ref: '#/components/parameters/GroupingIdParam'
    get:
      tags: [grouping-overrides]
      summary: List personnel overrides for a grouping
      x-access-control: admin
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonnelOverride'

    put:
      tags: [grouping-overrides]
      summary: Replace all personnel overrides for a grouping
      x-access-control: admin
      description: Full replacement. Writes `grouping.override_updated` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overrides]
              properties:
                overrides:
                  type: array
                  items:
                    $ref: '#/components/schemas/PersonnelOverrideInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonnelOverride'

  /groupings/{groupingId}/overrides/{persNo}:
    parameters:
      - $ref: '#/components/parameters/GroupingIdParam'
      - name: persNo
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [grouping-overrides]
      summary: Upsert override for a single person
      x-access-control: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonnelOverrideInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonnelOverride'
    delete:
      tags: [grouping-overrides]
      summary: Remove override (person reverts to estab assignment)
      x-access-control: admin
      responses:
        '204':
          description: Override removed

  # ---------------------------------------------------------------------------
  # GROUPING NOTES
  # ---------------------------------------------------------------------------

  /groupings/{groupingId}/notes/{persNo}:
    parameters:
      - $ref: '#/components/parameters/GroupingIdParam'
      - name: persNo
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [grouping-notes]
      summary: Get notes for a person in a grouping
      description: Accessible to any user with row access to this person in this grouping.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupingNote'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [grouping-notes]
      summary: Update notes (grouping view context)
      description: |
        Writes to canonical grouping_notes only.
        Does not update any attendance record's notes_snapshot.
        Accessible to scoped users with write access to this row.
        Writes `notes.updated` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notesText]
              properties:
                notesText:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupingNote'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------------
  # SESSIONS
  # ---------------------------------------------------------------------------

  /groupings/{groupingId}/sessions:
    parameters:
      - $ref: '#/components/parameters/GroupingIdParam'
    get:
      tags: [sessions]
      summary: List sessions for a grouping
      description: Scoped users see only sessions for groupings they have access to.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'

    post:
      tags: [sessions]
      summary: Create (open) a session
      x-access-control: admin
      description: |
        Creates an AM or PM session for a date. Grouping must be draft or active.
        On creation, auto-populates attendance_records for all active personnel in this
        grouping's estab (minus exclusions), with status='absent' and notes_snapshot
        from current grouping_notes.
        Returns 409 if a session already exists for this grouping/date/type.
        Writes `session.created` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '409':
          description: Session already exists for this grouping/date/type

  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionIdParam'
    get:
      tags: [sessions]
      summary: Get session details
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
    patch:
      tags: [sessions]
      summary: Close a session
      x-access-control: admin
      description: Sets status to `closed`. Writes `session.closed` to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [closed]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  # ---------------------------------------------------------------------------
  # ATTENDANCE (parade state view + editing)
  # ---------------------------------------------------------------------------

  /sessions/{sessionId}/attendance:
    parameters:
      - $ref: '#/components/parameters/SessionIdParam'
    get:
      tags: [attendance]
      summary: Get parade state — column manifest + scoped rows
      description: |
        Returns `columns` (user-visible column manifest) and `rows` (one per visible person).
        Row objects contain only keys present in the columns manifest.
        Rows are filtered to the user's subunit scope for this grouping.
        Admins receive all columns and all rows.

        Optional `subunit` filter narrows rows to a specific subunit within scope.
        Optional `status` filter narrows by one of the nine attendance statuses.

        This is the primary attendance-taking and parade state view endpoint.
      parameters:
        - name: subunit
          in: query
          description: Filter by subunit (within user scope)
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [present, absent, time_off, mc, yet_to_inpro, outpro, reporting_sick, late, att_out]
        - name: sortBy
          in: query
          schema:
            type: string
            description: Canonical or raw column name from the manifest
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceView'
        '403':
          $ref: '#/components/responses/Forbidden'

  /sessions/{sessionId}/attendance/{persNo}:
    parameters:
      - $ref: '#/components/parameters/SessionIdParam'
      - name: persNo
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [attendance]
      summary: Update attendance record (inline edit)
      description: |
        Writable fields for scoped users: `status`, `remarks`, `notesText`.
        `notesText` triggers a write-back to grouping_notes and updates
        notes_snapshot on this record.
        Unit+subunit snapshot update follows the validity-range rule:
          - If now() within grouping valid_from/valid_until: snapshots are updated.
          - If outside validity range: snapshots are NOT updated.
        Writes `attendance.updated` (and `notes.updated` if notesText changed) to audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Concurrent write conflict (last-write-wins; this is informational only)

  /sessions/{sessionId}/attendance/bulk:
    parameters:
      - $ref: '#/components/parameters/SessionIdParam'
    patch:
      tags: [attendance]
      summary: Bulk update attendance status
      description: |
        Convenience endpoint for marking all visible personnel present/absent at once.
        Applies the same validity-range snapshot rule as single updates.
        Each row write is independent; partial success is possible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, persNos]
              properties:
                status:
                  type: string
                  enum: [present, absent, time_off, mc, yet_to_inpro, outpro, reporting_sick, late, att_out]
                persNos:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        persNo: { type: string }
                        reason: { type: string }

  # ---------------------------------------------------------------------------
  # APP SETTINGS
  # ---------------------------------------------------------------------------

  /settings:
    get:
      tags: [app-settings]
      summary: Get all app settings
      x-access-control: admin
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    patch:
      tags: [app-settings]
      summary: Update app settings
      x-access-control: admin
      description: Partial update. Writes `app_settings.updated` to audit log per changed key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

  # ---------------------------------------------------------------------------
  # AUDIT LOG
  # ---------------------------------------------------------------------------

  /audit-log:
    get:
      tags: [audit-log]
      summary: Query audit log
      x-access-control: admin
      parameters:
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLog'

  # ---------------------------------------------------------------------------
  # EVENTS (SSE — stale data detection)
  # ---------------------------------------------------------------------------

  /events/attendance:
    get:
      tags: [events]
      summary: SSE stream for attendance stale detection
      description: |
        Server-Sent Events stream. The server emits a `data_changed` event when any
        attendance record within the authenticated user's current grouping+session scope
        is modified by a different user.

        The client should:
        1. Open this connection on entering the attendance view, passing groupingId and sessionId.
        2. On receiving `data_changed`, show a "Refresh" prompt to the user.
        3. On user confirming refresh, call GET /sessions/{sessionId}/attendance to reload.
        4. Close the connection on leaving the attendance view.

        The server does NOT push full record data over this stream — only change signals.
        Connection is authenticated via session cookie. The server closes the connection
        if the session expires or the user loses grouping access.

        Event format:
        ```
        event: data_changed
        data: {"groupingId": "...", "sessionId": "...", "updatedAt": "..."}
        ```

        Keep-alive ping every 30s:
        ```
        event: ping
        data: {}
        ```
      parameters:
        - name: groupingId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===========================================================================
  # Deferments (super-admin only)
  # ===========================================================================
  /deferments:
    get:
      tags: [deferments]
      summary: List deferments
      description: |
        Super-admin only. Returns deferments filtered by optional query params.
        `estab_id` joins through the deferment's linked personnel record.
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
        - name: personnel_id
          in: query
          schema: { type: string }
        - name: estab_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [Approved, Withdrawn, Rejected, To Resubmit, Time off arrangement,
                   Pending action, 'Not called up', 'Do not call up']
        - name: reason
          in: query
          schema:
            type: string
            enum: [Honeymoon, Work, Full-time studies, Other, Medical Grounds,
                   Examination, 'New employment', 'Special employment', Compassionate,
                   Childbirth, 'Part-time studies', 'Newly Established Business (Local)']
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: List of deferments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    personnel_id: { type: string, format: uuid }
                    estab_id: { type: string, format: uuid, nullable: true }
                    rank_name: { type: string }
                    sub_unit: { type: string, nullable: true }
                    reason: { type: string }
                    status: { type: string }
                    remarks: { type: string, nullable: true }
                    oc_updates: { type: string, nullable: true }
                    created_at: { type: string, format: date-time }
                    created_by: { type: string, format: uuid }
                    updated_at: { type: string, format: date-time, nullable: true }
                    updated_by: { type: string, format: uuid, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [deferments]
      summary: Create a deferment
      description: |
        Super-admin only. Snapshots `rank_name` (`{rank} {full_name}`) and
        `sub_unit` (first non-null of sub_unit_1/2/3) from the linked personnel
        at creation time. New deferments start with `status="Pending action"`,
        so callup_status is not affected.
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personnel_id, reason]
              properties:
                personnel_id: { type: string, format: uuid }
                reason:
                  type: string
                  enum: [Honeymoon, Work, Full-time studies, Other, Medical Grounds,
                         Examination, 'New employment', 'Special employment', Compassionate,
                         Childbirth, 'Part-time studies', 'Newly Established Business (Local)']
                remarks: { type: string, nullable: true }
                oc_updates: { type: string, nullable: true }
      responses:
        '201':
          description: Created
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deferments/{defermentId}:
    parameters:
      - name: defermentId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [deferments]
      summary: Fetch a single deferment
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
      responses:
        '200': { description: The deferment }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [deferments]
      summary: Update a deferment
      description: |
        Status changes drive the linked personnel's `callup_status`:
        Approved → Deferred; Approved → non-neutral → Called Up;
        `Not called up` / `Do not call up` are neutral (no change).
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
                  enum: [Honeymoon, Work, Full-time studies, Other, Medical Grounds,
                         Examination, 'New employment', 'Special employment', Compassionate,
                         Childbirth, 'Part-time studies', 'Newly Established Business (Local)']
                status:
                  type: string
                  nullable: true
                  enum: [Approved, Withdrawn, Rejected, To Resubmit, Time off arrangement,
                         Pending action, 'Not called up', 'Do not call up']
                remarks: { type: string, nullable: true }
                oc_updates: { type: string, nullable: true }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [deferments]
      summary: Delete a deferment
      description: |
        If the deleted deferment was Approved, the linked personnel's
        `callup_status` reverts to `Called Up`.
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ===========================================================================
  # Taggings (super-admin only) — overlay of person→subunit remappings on an NR
  # ===========================================================================
  /taggings:
    get:
      tags: [taggings]
      summary: List taggings
      description: |
        Super-admin only. Returns tagging summaries (no entries). Entry counts
        are computed via a correlated subquery.
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
        - name: nominal_roll_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: List of tagging summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    label: { type: string }
                    nominal_roll_id: { type: string, format: uuid }
                    remarks: { type: string, nullable: true }
                    entry_count: { type: integer }
                    created_at: { type: string, format: date-time }
                    created_by: { type: string, format: uuid }
                    updated_at: { type: string, format: date-time, nullable: true }
                    updated_by: { type: string, format: uuid, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [taggings]
      summary: Create a tagging (backfill only)
      description: |
        Super-admin only. Under the 1:1 model taggings are auto-created on NR
        ingestion — this endpoint exists to backfill NRs that predate the
        auto-creation flow. Returns 409 if the NR already has a tagging. For
        each entry, if `from_*` is omitted, the server snapshots the linked
        personnel's canonical subunit. Personnel must belong to the tagging's
        nominal roll (400 otherwise).
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nominal_roll_id]
              properties:
                label: { type: string, maxLength: 100, nullable: true }
                nominal_roll_id: { type: string, format: uuid }
                remarks: { type: string }
                entries:
                  type: array
                  default: []
                  items: { $ref: '#/components/schemas/TaggingEntryInput' }
      responses:
        '201':
          description: Tagging created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaggingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Nominal roll already has a tagging (1:1) }

  /taggings/{taggingId}:
    get:
      tags: [taggings]
      summary: Get a tagging (with entries)
      parameters:
        - name: taggingId
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
      responses:
        '200':
          description: Tagging detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaggingResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [taggings]
      summary: Update a tagging
      description: |
        Updates label/remarks. If `entries` is provided, the tagging's entries
        are full-replaced (existing entries deleted, new ones inserted).
        Omit `entries` to leave them untouched.
      parameters:
        - name: taggingId
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 100, nullable: true }
                remarks: { type: string, nullable: true }
                entries:
                  type: array
                  nullable: true
                  items: { $ref: '#/components/schemas/TaggingEntryInput' }
      responses:
        '200':
          description: Updated tagging
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaggingResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Constraint violation }
    delete:
      tags: [taggings]
      summary: Delete a tagging
      description: Cascades to entries. Does not mutate the underlying NR.
      parameters:
        - name: taggingId
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /taggings/{taggingId}/clone:
    post:
      tags: [taggings]
      summary: Merge a tagging's entries into a target NR's tagging
      description: |
        Super-admin only. Under the 1:1 model the target NR already has a
        tagging — this merges the source's entries into it. For each source
        entry, look up the target-NR Personnel row by `pers_no` (the
        cross-roll person identifier). Matched personnel get a new entry on
        the target tagging (with `from_*` re-snapshotted from the target
        personnel); personnel already on the target tagging are skipped (no
        clobber); unmatched source personnel (including NULL pers_no, which
        never matches) are surfaced in the response.
        Target NR must differ from source.
      parameters:
        - name: taggingId
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_nominal_roll_id]
              properties:
                target_nominal_roll_id: { type: string, format: uuid }
      responses:
        '200':
          description: Merge result
          content:
            application/json:
              schema:
                type: object
                properties:
                  tagging: { $ref: '#/components/schemas/TaggingResponse' }
                  source_count: { type: integer }
                  matched_count: { type: integer }
                  unmatched:
                    type: array
                    items:
                      type: object
                      properties:
                        pers_no: { type: string }
                        name: { type: string, nullable: true }
        '400': { description: Target NR same as source, or invalid }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Constraint violation }

  /csv/upload:
    post:
      tags: [csv]
      summary: Upload a CSV file for ingestion
      description: |
        Admin/super-admin only. Accepts a multipart CSV (`.csv`, ≤10 MB),
        computes its SHA256 (duplicate files return the existing upload
        with `is_duplicate: true`), parses the header row and line count,
        and stores the raw content. With `auto_process=true` the stored
        upload is immediately run through the same pipeline as
        `POST /csv/{uploadId}/process` (NominalRoll + Personnel +
        auto-created empty 1:1 Tagging): the result is returned in
        `process_result`, or the failure reason in `process_error` — the
        upload itself always succeeds and stays stored/unprocessed for
        the manual processing flow.
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
        - name: auto_process
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Process the upload into a Nominal Roll immediately
            after storing it; report the outcome instead of failing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Upload stored (metadata; `process_result` present only with auto_process)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  sha256_hash: { type: string }
                  original_filename: { type: string, nullable: true }
                  line_count: { type: integer }
                  detected_columns: { type: array, items: { type: string } }
                  status: { type: string }
                  uploaded_at: { type: string, format: date-time }
                  uploaded_by: { type: string, format: uuid }
                  is_duplicate: { type: boolean }
                  process_result:
                    nullable: true
                    type: object
                    description: Present when auto_process succeeded — same
                      shape as the /csv/{uploadId}/process 201 response.
                  process_error:
                    type: string
                    nullable: true
                    description: Present when auto_process failed; the upload
                      remains stored and unprocessed.
        '400': { description: Not a .csv file, empty, or undecodable }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: File exceeds 10 MB }

  /csv/{uploadId}/process:
    post:
      tags: [csv]
      summary: Process a stored CSV upload into a Nominal Roll
      description: |
        Admin/super-admin only. Reads the stored CsvUpload's raw content,
        parses the CAA date from the `caaYYMMDD` token in the original
        filename, and inserts a full NR pipeline: NominalRoll +
        ColumnMetadata + Personnel + an auto-created empty 1:1 Tagging. The
        upload is linked via `CsvUpload.nominal_roll_id` (already-processed
        uploads → 409; duplicate CAA → 409). Optional
        `source_nominal_roll_id` copies the source NR's tagging entries
        across by `pers_no` matching instead of starting empty; unmatched
        source personnel are surfaced in the response.
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string }
        - name: user_role
          in: query
          required: true
          schema: { type: string, enum: [super_admin, admin, user] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [created_by]
              properties:
                created_by: { type: string, format: uuid }
                source_nominal_roll_id: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: Processing result
          content:
            application/json:
              schema:
                type: object
                properties:
                  nominal_roll_id: { type: string, format: uuid }
                  personnel_inserted: { type: integer }
                  rows_skipped: { type: integer }
                  tagging_entries_imported: { type: integer }
                  unmatched:
                    type: array
                    items:
                      type: object
                      properties:
                        pers_no: { type: string }
                        name: { type: string, nullable: true }
        '400': { description: Unparseable filename or column count mismatch }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Upload already processed, or CAA already exists }

# =============================================================================
# COMPONENTS
# =============================================================================

components:

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------

  parameters:
    UserIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    UploadIdParam:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    GroupingIdParam:
      name: groupingId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SessionIdParam:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSizeParam:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  # ---------------------------------------------------------------------------
  # Responses
  # ---------------------------------------------------------------------------

  responses:
    Unauthorized:
      description: No valid session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient access level or grouping grant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found (or not visible to this user)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    # --- Nominal Roll ---

    NominalRollResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        caa: { type: string, format: date }
        attendance_active: { type: boolean }
        attendance_activated_at: { type: string, format: date-time, nullable: true }
        attendance_activated_by: { type: string, format: uuid, nullable: true }
        personnel_count: { type: integer }
        uploaded_at: { type: string, format: date-time }
        uploaded_by: { type: string, format: uuid }
        csv_hash: { type: string }
        original_filename: { type: string, nullable: true }
        label: { type: string, nullable: true }
        remarks: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # --- Tagging (super-admin overlay) ---

    TaggingEntryInput:
      type: object
      required: [personnel_id, to_unit]
      properties:
        personnel_id: { type: string, format: uuid }
        from_unit: { type: string, nullable: true }
        from_sub_unit_1: { type: string, nullable: true }
        from_sub_unit_2: { type: string, nullable: true }
        from_sub_unit_3: { type: string, nullable: true }
        to_unit: { type: string, minLength: 1 }
        to_sub_unit_1: { type: string, nullable: true }
        to_sub_unit_2: { type: string, nullable: true }
        to_sub_unit_3: { type: string, nullable: true }

    TaggingResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        nominal_roll_id: { type: string, format: uuid }
        remarks: { type: string, nullable: true }
        entries:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              tagging_id: { type: string, format: uuid }
              personnel_id: { type: string, format: uuid }
              personnel_pers_no: { type: string, nullable: true }
              personnel_label: { type: string, nullable: true }
              from_unit: { type: string, nullable: true }
              from_sub_unit_1: { type: string, nullable: true }
              from_sub_unit_2: { type: string, nullable: true }
              from_sub_unit_3: { type: string, nullable: true }
              to_unit: { type: string }
              to_sub_unit_1: { type: string, nullable: true }
              to_sub_unit_2: { type: string, nullable: true }
              to_sub_unit_3: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        updated_at: { type: string, format: date-time, nullable: true }
        updated_by: { type: string, format: uuid, nullable: true }

    # --- Auth ---

    SessionInfo:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [super_admin, admin, scoped]
        accessLevel:
          $ref: '#/components/schemas/AccessLevel'
        groupingGrants:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of groupings this user can access

    # --- Users ---

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [super_admin, admin, scoped]
        status:
          type: string
          enum: [pending, active, suspended, unrecognised]
        accessLevel:
          $ref: '#/components/schemas/AccessLevel'
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
          nullable: true

    CreateUserRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Lowercased server-side to match the Google sign-in email
        name:
          type: string
          description: Defaults to the email local part
        role:
          type: string
          enum: [super_admin, admin, user]
          default: user

    UpdateUserRequest:
      type: object
      properties:
        role:
          type: string
          enum: [super_admin, admin, user]
        status:
          type: string
          enum: [pending, active, suspended, unrecognised]
        accessLevelId:
          type: string
          format: uuid
          nullable: true

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    UserGroupingGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        groupingId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    UserSubunitGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        groupingId:
          type: string
          format: uuid
        unit:
          type: string
          nullable: true
        subUnit1:
          type: string
          nullable: true
        subUnit2:
          type: string
          nullable: true
        subUnit3:
          type: string
          nullable: true

    SubunitGrantInput:
      type: object
      required: [groupingId]
      properties:
        groupingId:
          type: string
          format: uuid
        unit:
          type: string
          nullable: true
        subUnit1:
          type: string
          nullable: true
        subUnit2:
          type: string
          nullable: true
        subUnit3:
          type: string
          nullable: true

    # --- Access levels ---

    AccessLevel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        levelOrder:
          type: integer
        deprecated:
          type: boolean

    AccessLevelInput:
      type: object
      required: [label, levelOrder]
      properties:
        label:
          type: string
        levelOrder:
          type: integer

    # --- Subunit enums ---

    SubunitEnumValue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        level:
          type: integer
        value:
          type: string
        deprecated:
          type: boolean

    # --- Column mappings ---

    ColumnMapping:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rawName:
          type: string
        canonicalName:
          type: string
        status:
          type: string
          enum: [auto_detected, admin_confirmed, deprecated]
        deprecated:
          type: boolean
        firstSeenIn:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        confirmedBy:
          type: string
          format: uuid
          nullable: true

    # --- CSV uploads ---

    CsvUploadSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caaDate:
          type: string
          format: date
        originalFilename:
          type: string
        status:
          type: string
          enum: [pending_mapping, pending_diff, confirmed, superseded]
        rowCount:
          type: integer
          nullable: true
        uploadedAt:
          type: string
          format: date-time
        uploadedBy:
          type: string
          format: uuid

    CsvUploadDetail:
      allOf:
        - $ref: '#/components/schemas/CsvUploadSummary'
        - type: object
          properties:
            contentHash:
              type: string
            confirmedAt:
              type: string
              format: date-time
              nullable: true

    CsvUploadMappingPayload:
      type: object
      description: Returned after upload; drives the mapping confirmation UI
      properties:
        uploadId:
          type: string
          format: uuid
        caaDate:
          type: string
          format: date
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnMappingResolutionItem'
        requiredCanonicalNames:
          type: array
          items:
            type: string
          description: Canonical names that must all be mapped before confirming

    ColumnMappingResolutionItem:
      type: object
      description: One CSV column, its suggested mapping, and whether it needs admin resolution
      properties:
        rawName:
          type: string
        suggestedCanonicalName:
          type: string
          nullable: true
        existingMapping:
          type: string
          nullable: true
          description: Current global mapping for this rawName (if any)
        conflict:
          type: boolean
          description: True if suggestedCanonicalName differs from existingMapping
        isRequired:
          type: boolean
          description: True if this rawName matches a required canonical column
        resolutionRequired:
          type: boolean
          description: True if admin must explicitly confirm or remap before proceeding

    ConfirmMappingsRequest:
      type: object
      required: [mappings]
      properties:
        mappings:
          type: array
          items:
            type: object
            required: [rawName, canonicalName]
            properties:
              rawName:
                type: string
              canonicalName:
                type: string
                nullable: true
                description: null to leave column unmapped (only permitted for non-required columns)

    MappingValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            unmappedRequired:
              type: array
              items:
                type: string
              description: Required canonical names still without a mapping
            unresolvedConflicts:
              type: array
              items:
                type: string
              description: rawNames with unconfirmed conflicts

    CsvDiffPayload:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
        summary:
          type: object
          properties:
            joined:
              type: integer
            left:
              type: integer
            changed:
              type: integer
            unchanged:
              type: integer
        rows:
          type: array
          description: All diff rows in display order (joiners, leavers, changed, unchanged)
          items:
            $ref: '#/components/schemas/DiffRow'

    DiffRow:
      type: object
      properties:
        persNo:
          type: string
        changeType:
          type: string
          enum: [joined, left, changed, unchanged]
        rank:
          type: string
          nullable: true
        fullName:
          type: string
          nullable: true
        changes:
          type: array
          description: Present only when changeType=changed
          items:
            type: object
            properties:
              field:
                type: string
              oldValue:
                type: string
                nullable: true
              newValue:
                type: string
                nullable: true

    CsvConfirmResult:
      type: object
      properties:
        csvUploadId:
          type: string
          format: uuid
        groupingId:
          type: string
          format: uuid
          description: ID of the auto-created estab grouping
        personnelCount:
          type: integer
        archivedCount:
          type: integer
        notesTransferred:
          type: integer

    # --- Column metadata ---

    ColumnMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        csvUploadId:
          type: string
          format: uuid
        rawName:
          type: string
        canonicalName:
          type: string
          nullable: true
        isRequired:
          type: boolean
        confirmedType:
          type: string
          nullable: true
          enum: [text, integer, date, boolean, numeric]
        sensitivityLabel:
          type: string
          nullable: true
          description: null = admin-only
        displayOrder:
          type: integer
          nullable: true

    # --- Groupings ---

    GroupingSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [draft, active, inactive, archived]
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        scheduledActivation:
          type: string
          format: date-time
          nullable: true
        csvUploadId:
          type: string
          format: uuid
        caaDate:
          type: string
          format: date

    Grouping:
      allOf:
        - $ref: '#/components/schemas/GroupingSummary'
        - type: object
          properties:
            clonedFromId:
              type: string
              format: uuid
              nullable: true
            cloneType:
              type: string
              enum: [same_estab, cross_estab]
              nullable: true
            overrideCount:
              type: integer
            createdAt:
              type: string
              format: date-time
            createdBy:
              type: string
              format: uuid

    CreateGroupingRequest:
      type: object
      required: [name, csvUploadId, validFrom, validUntil]
      properties:
        name:
          type: string
        csvUploadId:
          type: string
          format: uuid
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        scheduledActivation:
          type: string
          format: date-time
          nullable: true

    UpdateGroupingRequest:
      type: object
      properties:
        name:
          type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        scheduledActivation:
          type: string
          format: date-time
          nullable: true

    GroupingOverlapError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            conflictingGroupings:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  validFrom:
                    type: string
                    format: date-time
                  validUntil:
                    type: string
                    format: date-time

    CloneGroupingRequest:
      type: object
      properties:
        name:
          type: string
          description: Defaults to "Copy of {source name}" if omitted
        transferNotes:
          type: boolean
          default: false
          description: Whether to copy grouping_notes to the new grouping

    MigrateResolutionPayload:
      type: object
      description: Returned by POST /groupings/{id}/migrate; drives the resolution UI
      properties:
        sourceGroupingId:
          type: string
          format: uuid
        targetCsvUploadId:
          type: string
          format: uuid
        leavers:
          type: array
          description: In source estab, not in target. Each must be individually dismissed.
          items:
            $ref: '#/components/schemas/MigratePersonnelRow'
        joiners:
          type: array
          description: In target estab, not in source. Each needs unit+subunit assignment.
          items:
            $ref: '#/components/schemas/MigratePersonnelRow'
        continuing:
          type: array
          description: In both. Carries over automatically with existing overrides.
          items:
            $ref: '#/components/schemas/MigratePersonnelRow'

    MigratePersonnelRow:
      type: object
      properties:
        persNo:
          type: string
        rank:
          type: string
        fullName:
          type: string
        estabUnit:
          type: string
          nullable: true
        estabSubUnit1:
          type: string
          nullable: true
        estabSubUnit2:
          type: string
          nullable: true
        estabSubUnit3:
          type: string
          nullable: true
        currentOverride:
          $ref: '#/components/schemas/PersonnelOverrideInput'
          nullable: true

    MigrateConfirmRequest:
      type: object
      required: [name, transferNotes, dismissedLeaverPersNos, joinerAssignments]
      properties:
        name:
          type: string
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
        transferNotes:
          type: boolean
        dismissedLeaverPersNos:
          type: array
          description: Must include ALL leavers from the resolution payload to confirm
          items:
            type: string
        joinerAssignments:
          type: array
          description: Unit+subunit assignment for each joiner
          items:
            $ref: '#/components/schemas/PersonnelOverrideInput'

    # --- Grouping overrides ---

    PersonnelOverride:
      type: object
      properties:
        id:
          type: string
          format: uuid
        groupingId:
          type: string
          format: uuid
        persNo:
          type: string
        unit:
          type: string
        subUnit1:
          type: string
          nullable: true
        subUnit2:
          type: string
          nullable: true
        subUnit3:
          type: string
          nullable: true

    PersonnelOverrideInput:
      type: object
      required: [persNo, unit]
      properties:
        persNo:
          type: string
        unit:
          type: string
        subUnit1:
          type: string
          nullable: true
        subUnit2:
          type: string
          nullable: true
        subUnit3:
          type: string
          nullable: true

    # --- Grouping notes ---

    GroupingNote:
      type: object
      properties:
        groupingId:
          type: string
          format: uuid
        persNo:
          type: string
        notesText:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
          nullable: true

    # --- Sessions ---

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        groupingId:
          type: string
          format: uuid
        sessionDate:
          type: string
          format: date
        sessionType:
          type: string
          enum: [AM, PM]
        status:
          type: string
          enum: [open, closed]
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid

    CreateSessionRequest:
      type: object
      required: [sessionDate, sessionType]
      properties:
        sessionDate:
          type: string
          format: date
        sessionType:
          type: string
          enum: [AM, PM]

    # --- Attendance ---

    AttendanceView:
      type: object
      description: |
        Column-manifest + rows response. Clients render table headers from `columns`
        and row cells from `rows[n][column.key]`. Keys not in the manifest are never
        present in row objects.
      properties:
        sessionId:
          type: string
          format: uuid
        groupingId:
          type: string
          format: uuid
        sessionDate:
          type: string
          format: date
        sessionType:
          type: string
          enum: [AM, PM]
        columns:
          type: array
          description: Ordered list of columns visible to this user
          items:
            $ref: '#/components/schemas/ColumnManifestEntry'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AttendanceRow'
        meta:
          type: object
          properties:
            totalRows:
              type: integer
            presentCount:
              type: integer
            absentCount:
              type: integer

    ColumnManifestEntry:
      type: object
      properties:
        key:
          type: string
          description: The key used in row objects (canonical name or raw name if unmapped)
        label:
          type: string
          description: Display label for column header
        type:
          type: string
          enum: [text, integer, date, boolean, numeric]
        isAttendanceField:
          type: boolean
          description: True for status, remarks, notes — these are inline-editable by scoped users
        displayOrder:
          type: integer

    AttendanceRow:
      type: object
      description: |
        Keys are the `key` values from the columns manifest. Always present:
        persNo, rank, fullName, unit, subUnit1/2/3, status, remarks, notes.
        All other keys depend on the user's access level.
      properties:
        persNo:
          type: string
        status:
          type: string
          enum: [present, absent, time_off, mc, yet_to_inpro, outpro, reporting_sick, late, att_out]
          default: absent
        remarks:
          type: string
        notes:
          type: string
          description: Live canonical notes (not snapshot) for display
        notesUpdatedAt:
          type: string
          format: date-time
          nullable: true
        notesUpdatedBy:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          nullable: true
      additionalProperties:
        description: Additional personnel fields visible to this user per column manifest

    AttendanceRecord:
      type: object
      description: Single attendance record as returned after a PATCH
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        persNo:
          type: string
        status:
          type: string
          enum: [present, absent, time_off, mc, yet_to_inpro, outpro, reporting_sick, late, att_out]
          default: absent
        remarks:
          type: string
        notesSnapshot:
          type: string
        unitSnapshot:
          type: string
          nullable: true
        subUnit1Snapshot:
          type: string
          nullable: true
        subUnit2Snapshot:
          type: string
          nullable: true
        subUnit3Snapshot:
          type: string
          nullable: true
        snapshotTakenAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
          nullable: true

    AttendanceUpdateRequest:
      type: object
      description: At least one of status, remarks, notesText must be present
      properties:
        status:
          type: string
          enum: [present, absent, time_off, mc, yet_to_inpro, outpro, reporting_sick, late, att_out]
        remarks:
          type: string
          maxLength: 500
        notesText:
          type: string
          maxLength: 2000
          description: |
            If present, triggers write-back to grouping_notes and updates
            notes_snapshot on this attendance record.

    # --- Audit log ---

    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
          nullable: true
        actorEmail:
          type: string
          nullable: true
        action:
          type: string
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
          nullable: true
        payload:
          type: object
          additionalProperties: true
        ipAddress:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time

    PaginatedAuditLog:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
