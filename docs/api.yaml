      responses:
        "200":
          description: Tagging summaries.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/TaggingListItem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [taggings]
      summary: Backfill-create the tagging for an NR.
      description: 409 when the NR already has one (taggings are auto-created on CSV processing); personnel must belong to the NR (one remap per person).
