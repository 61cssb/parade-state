        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/taggings/{tagging_id}:
    get:
      tags: [taggings]
      summary: One tagging with entries.
      x-access-control: super_admin
      x-feature-flag: FEATURE_NOMINALROLL
