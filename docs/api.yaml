  # =========================================================================
  # Access control (scope grants)
  # =========================================================================
  /api/v1/access-control/nominal-rolls/{nominal_roll_id}/users/{user_id}/subunit-assignments:
    post:
      tags: [access-control]
      summary: Grant one (unit, sub_unit_1) scope pair on an NR.
      description: >
        `*` wildcards a column (unit='*', sub_unit_1='*'), but not both
        (400). Concrete values must exist on the NR's roster
        (case-sensitive). Duplicate grant → 409.
      x-access-control: super_admin
      parameters:
        - {$ref: "#/components/parameters/NominalRollId"}
        - {$ref: "#/components/parameters/UserId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubunitAssignmentCreate"}
      responses:
        "201":
          description: Grant created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubunitAssignmentResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/access-control/nominal-rolls/{nominal_roll_id}/subunit-assignments:
    get:
      tags: [access-control]
      summary: Grants on an NR.
      description: super_admin sees all; other users see only their own grants.
      x-access-control: authenticated
      parameters:
        - {$ref: "#/components/parameters/NominalRollId"}
      responses:
        "200":
          description: Grants (with the NR display label).
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SubunitAssignmentResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/access-control/nominal-rolls/{nominal_roll_id}/scope-options:
    get:
      tags: [access-control]
      summary: Units and unit→sub_unit_1 values on the NR roster.
      description: Feeds the grant form dropdowns in /admin/users.
      x-access-control: super_admin
      parameters:
        - {$ref: "#/components/parameters/NominalRollId"}
      responses:
        "200":
          description: Dropdown data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  units:
                    type: array
                    items: {type: string}
                  subunits_by_unit:
                    type: object
                    additionalProperties:
                      type: array
                      items: {type: string}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/access-control/users/{user_id}/subunit-assignments:
    get:
      tags: [access-control]
      summary: A user's grants across all NRs.
      description: Users see only their own; super_admin sees any user (403 otherwise).
      x-access-control: authenticated
      parameters:
        - {$ref: "#/components/parameters/UserId"}
      responses:
        "200":
          description: Grants (with NR display labels).
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/SubunitAssignmentResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/access-control/nominal-rolls/{nominal_roll_id}/users/{user_id}/subunit-assignments/{assignment_id}:
    delete:
      tags: [access-control]
      summary: Revoke a scope grant.
      description: Returns 200 with a detail message (not 204).
      x-access-control: super_admin
      parameters:
        - {$ref: "#/components/parameters/NominalRollId"}
        - {$ref: "#/components/parameters/UserId"}
        - {name: assignment_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: {type: string}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  # =========================================================================
  # CSV upload (FEATURE_NOMINALROLL)
  # =========================================================================
  /api/v1/csv/upload:
    post:
      tags: [csv-upload]
      summary: Step 1 — store a CSV file.
      description: >
        Super-admin only (minting an NR is an NR-lifecycle operation).
        .csv extension required; empty file 400; over 10 MB 413. A
        duplicate sha256 returns the existing upload with
        `is_duplicate: true` (200, no second row). With
        `auto_process=true` the Step-2 pipeline runs immediately:
        success in `process_result`, failure reason in `process_error`
        (the upload stays stored either way).
      x-access-control: super_admin
      x-feature-flag: FEATURE_NOMINALROLL
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: UTF-8 (Latin-1 fallback) CSV, ≤ 10 MB.
      parameters:
        - {name: auto_process, in: query, schema: {type: boolean, default: false}}
      responses:
        "200":
          description: Stored upload (or the pre-existing duplicate).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CsvUploadResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "413":
          description: File exceeds 10 MB.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/v1/csv/uploads:
    get:
      tags: [csv-upload]
      summary: Recent uploads (metadata only, newest first).
      x-access-control: admin
      x-feature-flag: FEATURE_NOMINALROLL
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: Upload list.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/CsvUploadListItem"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/csv/{upload_id}/process:
    post:
      tags: [csv-upload]
      summary: Step 2 — process a stored upload into a NominalRoll.
      description: >
        Parses the CAA date from the original filename (`caaYYMMDD`
        token; 400 when absent), rejects an NR that already has that CAA
        (409) and re-processing a linked upload (409). Columns are
        matched by header name (missing required column → 400); only
        rows whose Callup Decision is exactly "Yes" are stored; the
        auto-created 1:1 tagging optionally imports the source NR's
        entries by pers_no. Creates NR + personnel + column metadata +
        tagging in one transaction.
      x-access-control: super_admin
      x-feature-flag: FEATURE_NOMINALROLL
      parameters:
        - {name: upload_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CsvProcessRequest"}
      responses:
        "201":
          description: Created NR + ingestion diagnostics.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CsvProcessResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  # =========================================================================
  # Groupings (FEATURE_GROUPING + matrix "grouping")
  # =========================================================================
  /api/v1/groupings/:
    get:
      tags: [groupings]
      summary: Groupings on the attendance-active NR.
      description: Reads are open to every role; reachability follows the active NR (empty list when none).
      x-access-control: authenticated
      x-feature-flag: FEATURE_GROUPING
      responses:
        "200":
          description: Groupings.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/GroupingResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    post:
      tags: [groupings]
      summary: Create a grouping on the active NR.
      description: Label unique per NR (409); group labels unique within the payload (400).
      x-access-control: super_admin
      x-feature-flag: FEATURE_GROUPING
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GroupingCreate"}
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupingResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/groupings/{grouping_id}:
    get:
      tags: [groupings]
      summary: One grouping (with per-group member counts).
      description: Groupings on a non-active NR are unreachable (404).
      x-access-control: authenticated
      x-feature-flag: FEATURE_GROUPING
      parameters:
        - {$ref: "#/components/parameters/GroupingId"}
      responses:
        "200":
          description: Grouping.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupingResponse"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    patch:
      tags: [groupings]
      summary: Update label and the group-enum set.
      description: >
        `multiple_membership`/`allow_ungrouped` are immutable (400 — use
        clone). The `groups` payload is a full-set replacement: add,
        rename-in-place, reorder, remove; removals that would strand a
        serviceman are rejected (400) when `allow_ungrouped` is false.
      x-access-control: super_admin
      x-feature-flag: FEATURE_GROUPING
      parameters:
        - {$ref: "#/components/parameters/GroupingId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GroupingUpdate"}
      responses:
        "200":
          description: Grouping.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupingResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      tags: [groupings]
      summary: Delete a grouping (groups/memberships/state cascade).
      x-access-control: super_admin
      x-feature-flag: FEATURE_GROUPING
      parameters:
        - {$ref: "#/components/parameters/GroupingId"}
      responses:
        "204": {description: Deleted.}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/groupings/{grouping_id}/personnel/{personnel_id}/groups:
    put:
      tags: [groupings]
      summary: Set a serviceman's full membership set.
      description: Validates group ids, single-membership mode and the allow_ungrouped rule (400 otherwise).
      x-access-control: super_admin
      x-feature-flag: FEATURE_GROUPING
      parameters:
        - {$ref: "#/components/parameters/GroupingId"}
        - {$ref: "#/components/parameters/PersonnelId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MembershipSetRequest"}
      responses:
        "200":
          description: Grouping.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupingResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/groupings/{grouping_id}/personnel/{personnel_id}/state:
    patch:
      tags: [groupings]
      summary: Update a serviceman's checkbox / remarks.
      x-access-control: super_admin
      x-feature-flag: FEATURE_GROUPING
      parameters:
        - {$ref: "#/components/parameters/GroupingId"}
        - {$ref: "#/components/parameters/PersonnelId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemberStateUpdate"}
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: {type: string, example: Member state updated}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/groupings/{grouping_id}/clone:
    post:
      tags: [groupings]
      summary: Clone within the same NR under a fresh label.
      description: Structure always carries over; memberships + member state only when `include_memberships` is true.
      x-access-control: super_admin
      x-feature-flag: FEATURE_GROUPING
      parameters:
        - {$ref: "#/components/parameters/GroupingId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GroupingCloneRequest"}
      responses:
        "201":
          description: Clone.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupingResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/groupings/copy-from-previous:
    post:
      tags: [groupings]
      summary: Copy a grouping from the previously activated NR.
      description: Group enums + flags carry over; memberships re-link by pers_no (unmatched start ungrouped); member state is never copied.
      x-access-control: super_admin
      x-feature-flag: FEATURE_GROUPING
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GroupingCopyRequest"}
      responses:
        "201":
          description: Copy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GroupingResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/groupings/{grouping_id}/export:
    get:
      tags: [groupings]
      summary: CSV of the grouping table (no attendance data).
      description: Columns Group, Rank, Name, Unit, Sub Unit, Checkbox, Remarks.
      x-access-control: authenticated
      x-feature-flag: FEATURE_GROUPING
      parameters:
        - {$ref: "#/components/parameters/GroupingId"}
      responses:
        "200":
          description: text/csv attachment.
          content:
            text/csv:
              schema: {type: string}
        "404": {$ref: "#/components/responses/NotFound"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  # =========================================================================
  # Audit
  # =========================================================================
  /api/v1/audit/logs:
    get:
      tags: [audit]
      summary: Audit trail, newest first.
      description: user_name/user_email resolved via left outer join (system rows → null).
      x-access-control: admin
      parameters:
        - {name: entity_type, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: target_user_id, in: query, schema: {type: string}, description: Entries created by this user.}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 50}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: Paginated audit entries.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditLogListResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  # =========================================================================
  # Admin JSON
  # =========================================================================
  /api/v1/admin/feature-access:
    post:
      tags: [admin]
      summary: Upsert the admin-role feature-access matrix.
      description: Full-matrix save (one item per configured feature); keys validated server-side; only value changes are audited.
      x-access-control: super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FeatureAccessUpdate"}
      responses:
        "200":
          description: Effective matrix after the save.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeatureAccessResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {description: Unknown feature_key (validation error).}

  /api/v1/admin/purge:
    post:
      tags: [admin]
      summary: Testing-only purge of all NR data.
      description: >
        Deletes every nominal roll and downstream data in one transaction
        (users, access levels, sessions, audit log preserved; the purge
        itself is audited). Gated by `PURGE_ENABLED` (400 when off).
        `confirmation` is whitespace-stripped and must equal `PURGE`.
      x-access-control: super_admin
      parameters:
        - {name: confirmation, in: query, required: true, schema: {type: string, example: PURGE}}
      responses:
        "200":
          description: Purge summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: {type: string}
                  purged_at: {type: string, format: date-time}
                  purged_counts:
                    type: object
                    additionalProperties: {type: integer}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/v1/admin/database/restore:
    post:
      tags: [admin]
      summary: Restore the database from a pg_dump custom-format archive.
      description: >
        Super-admin only; gated by `RESTORE_ENABLED` (400) and PostgreSQL
        (400). Upload ≤ 25 MB `.dump`; `confirmation` must equal the
        current database name (whitespace-stripped). One restore at a
        time per process (409). Verify-then-swap; returns the
        verification summary.
      x-access-control: super_admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: pg_dump custom-format archive (.dump).
      parameters:
        - {name: confirmation, in: query, required: true, schema: {type: string}, description: Current database name.}
      responses:
        "200":
          description: Verification summary (restore_from_dump result).
          content:
            application/json:
              schema: {type: object}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "413": {description: Dump exceeds 25 MB.}

# =============================================================================
# Components
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: DB-backed session token (same value as the HttpOnly session cookie).

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema: {type: string}
    PersonnelId:
      name: personnel_id
      in: path
      required: true
      schema: {type: string}
    NominalRollId:
      name: nominal_roll_id
      in: path
      required: true
      schema: {type: string}
    TaggingId:
      name: tagging_id
      in: path
      required: true
      schema: {type: string}
    DefermentId:
      name: deferment_id
      in: path
      required: true
      schema: {type: string}
    PostId:
      name: post_id
      in: path
      required: true
      schema: {type: string}
    CommentId:
      name: comment_id
      in: path
      required: true
      schema: {type: string}
    GroupingId:
      name: grouping_id
      in: path
      required: true
      schema: {type: string}

  responses:
    Unauthorized:
      description: Missing/invalid session (401).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: Role tier, feature matrix, or scope grant refused (403).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BadRequest:
      description: Validation failure (400).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Missing resource (404). Flag-off features also answer 404.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Uniqueness / state conflict (409).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      properties:
        detail: {type: string}

    # ----- users -----------------------------------------------------------
    UserListItem:
      type: object
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        role: {type: string, enum: [super_admin, admin, user]}
        status: {type: string, enum: [pending, active, suspended, unrecognised]}
        access_level_id: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        last_sign_in_at: {type: [string, "null"], format: date-time}

    UserMutationResponse:
      type: object
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        role: {type: string, enum: [super_admin, admin, user]}
        status: {type: string}
        access_level_id: {type: [string, "null"]}
        updated_at: {type: string, format: date-time}

    UserCreate:
      type: object
      required: [email]
      properties:
        email: {type: string}
        name: {type: string}
        role: {type: string, enum: [super_admin, admin, user], default: user}

    UserUpdate:
      type: object
      properties:
        name: {type: string}
        status: {type: string, enum: [pending, active, suspended, unrecognised]}
        role: {type: string, enum: [super_admin, admin, user]}
        access_level_id: {type: string}

    # ----- attendance ------------------------------------------------------
    AttendanceUpsertEntry:
      type: object
      required: [personnel_id, date]
      properties:
        personnel_id: {type: string}
        date: {type: string, format: date}
        status: {type: string, enum: [present, absent], default: absent}
        reason:
          type: [string, "null"]
          enum: [mc, off, early_outpro, other, awol, null]
        remarks: {type: [string, "null"]}

    AttendanceBulkUpsert:
      type: object
      required: [nominal_roll_id, records]
      properties:
        nominal_roll_id: {type: string}
        records:
          type: array
          items: {$ref: "#/components/schemas/AttendanceUpsertEntry"}

    AttendanceResponse:
      type: object
      properties:
        id: {type: string}
        personnel_id: {type: string}
        nominal_roll_id: {type: string}
        date: {type: string, format: date}
        status: {type: string, enum: [present, absent]}
        reason: {type: [string, "null"], enum: [mc, off, early_outpro, other, awol, null]}
        remarks: {type: [string, "null"]}
        notes_snapshot: {type: [string, "null"]}
        unit_snapshot: {type: [string, "null"]}
        sub_unit_1_snapshot: {type: [string, "null"]}
        sub_unit_2_snapshot: {type: [string, "null"]}
        sub_unit_3_snapshot: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
        last_edit_at: {type: [string, "null"], format: date-time}
        last_edit_by: {type: [string, "null"]}
        is_retroactive_edit: {type: boolean}

    CopyRemarksResponse:
      type: object
      properties:
        nominal_roll_id: {type: string}
        source_date: {type: string, format: date}
        dest_date: {type: string, format: date}
        updated: {type: integer}
        skipped: {type: integer}

    AttendanceFreezeRequest:
      type: object
      required: [nominal_roll_id, date]
      properties:
        nominal_roll_id: {type: string}
        date: {type: string, format: date}

    AttendanceFreezeResponse:
      type: object
      properties:
        nominal_roll_id: {type: string}
        date: {type: string, format: date}
        frozen: {type: boolean}
        frozen_at: {type: [string, "null"], format: date-time}

    AttendanceHistoryItem:
      type: object
      properties:
        id: {type: string}
        nominal_roll_id: {type: string}
        date: {type: string, format: date}
        status: {type: string}
        reason: {type: [string, "null"]}
        remarks: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    AttendanceHistoryResponse:
      type: object
      properties:
        personnel_id: {type: string}
        nominal_roll_id: {type: [string, "null"]}
        date_from: {type: [string, "null"], format: date}
        date_to: {type: [string, "null"], format: date}
        stats:
          type: object
          properties:
            total_days: {type: integer}
            present_days: {type: integer}
            absent_days: {type: integer}
            attendance_rate: {type: number}
        attendance_records:
          type: array
          items: {$ref: "#/components/schemas/AttendanceHistoryItem"}
        total_count: {type: integer}

    # ----- personnel -------------------------------------------------------
    PersonnelResponse:
      type: object
      properties:
        id: {type: string}
        nominal_roll_id: {type: string}
        pers_no: {type: [string, "null"]}
        rank: {type: string}
        category: {type: string, enum: [Officer, WOSE]}
        name: {type: string}
        unit: {type: string}
        sub_unit_1: {type: [string, "null"]}
        sub_unit_2: {type: [string, "null"]}
        sub_unit_3: {type: [string, "null"]}
        status: {type: string, enum: [active, archived]}
        inpro_status: {type: string, enum: [inproed, yet_to_inpro, deferred]}
        remarks: {type: [string, "null"]}
        source: {type: [string, "null"], description: "manual = super-admin add; null = CSV ingestion."}
        created_at: {type: string, format: date-time}
        updated_at: {type: [string, "null"], format: date-time}
        created_by: {type: string}
        updated_by: {type: [string, "null"]}

    PersonnelCreate:
      type: object
      required: [nominal_roll_id, rank, name, unit]
      properties:
        nominal_roll_id: {type: string}
        pers_no: {type: [string, "null"]}
        rank: {type: string}
        name: {type: string}
        unit: {type: string}
        sub_unit_1: {type: [string, "null"]}
        sub_unit_2: {type: [string, "null"]}
        sub_unit_3: {type: [string, "null"]}
        inpro_status: {type: string, enum: [inproed, yet_to_inpro, deferred], default: yet_to_inpro}
        remarks: {type: [string, "null"]}

    PersonnelUpdate:
      type: object
      description: >
        Field-level roles: rank/name rejected (409); pers_no, inpro_status,
        unit and sub_unit_1 super-admin-only; sub_unit_2/3, status
        (active|archived) and remarks open to in-scope admins.
      properties:
        pers_no: {type: [string, "null"]}
        rank: {type: string}
        name: {type: string}
        unit: {type: string}
        sub_unit_1: {type: [string, "null"]}
        sub_unit_2: {type: [string, "null"]}
        sub_unit_3: {type: [string, "null"]}
        status: {type: string, enum: [active, archived]}
        inpro_status: {type: string, enum: [inproed, yet_to_inpro, deferred]}
        remarks: {type: [string, "null"]}

    # ----- nominal rolls ---------------------------------------------------
    NominalRollListItem:
      type: object
      properties:
        id: {type: string}
        caa: {type: string, format: date}
        attendance_active: {type: boolean}
        personnel_count: {type: integer}
        uploaded_at: {type: string, format: date-time}
        uploaded_by: {type: string}
        csv_hash: {type: string}
        original_filename: {type: [string, "null"]}
        label: {type: [string, "null"]}
        remarks: {type: [string, "null"]}

    NominalRollResponse:
      allOf:
        - {$ref: "#/components/schemas/NominalRollListItem"}
        - type: object
          properties:
            notes: {type: [string, "null"]}
            attendance_activated_at: {type: [string, "null"], format: date-time}
            attendance_activated_by: {type: [string, "null"]}
            created_at: {type: string, format: date-time}

    NominalRollUpdate:
      type: object
      properties:
        notes: {type: [string, "null"]}
        label: {type: [string, "null"], maxLength: 100}
        remarks: {type: [string, "null"]}

    # ----- taggings --------------------------------------------------------
    TaggingEntryInput:
      type: object
      required: [personnel_id, to_unit]
      properties:
        personnel_id: {type: string}
        from_unit: {type: [string, "null"], description: Omitted from_* values are snapshotted from the personnel.}
        from_sub_unit_1: {type: [string, "null"]}
        from_sub_unit_2: {type: [string, "null"]}
        from_sub_unit_3: {type: [string, "null"]}
        to_unit: {type: string}
        to_sub_unit_1: {type: [string, "null"]}
        to_sub_unit_2: {type: [string, "null"]}
        to_sub_unit_3: {type: [string, "null"]}

    TaggingEntryResponse:
      type: object
      properties:
        id: {type: string}
        tagging_id: {type: string}
        personnel_id: {type: string}
        personnel_pers_no: {type: [string, "null"]}
        personnel_label: {type: [string, "null"]}
        from_unit: {type: [string, "null"]}
        from_sub_unit_1: {type: [string, "null"]}
        from_sub_unit_2: {type: [string, "null"]}
        from_sub_unit_3: {type: [string, "null"]}
        to_unit: {type: string}
        to_sub_unit_1: {type: [string, "null"]}
        to_sub_unit_2: {type: [string, "null"]}
        to_sub_unit_3: {type: [string, "null"]}

    TaggingCreate:
      type: object
      required: [nominal_roll_id]
      properties:
        label: {type: [string, "null"], maxLength: 100}
        nominal_roll_id: {type: string}
        remarks: {type: [string, "null"]}
        entries:
          type: array
          items: {$ref: "#/components/schemas/TaggingEntryInput"}

    TaggingUpdate:
      type: object
      properties:
        label: {type: [string, "null"], maxLength: 100}
        remarks: {type: [string, "null"]}
        entries:
          type: [array, "null"]
          items: {$ref: "#/components/schemas/TaggingEntryInput"}
          description: When supplied, entries are full-replaced.

    TaggingListItem:
      type: object
      properties:
        id: {type: string}
        label: {type: [string, "null"]}
        nominal_roll_id: {type: string}
        remarks: {type: [string, "null"]}
        entry_count: {type: integer}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: [string, "null"], format: date-time}
        updated_by: {type: [string, "null"]}

    TaggingResponse:
      type: object
      properties:
        id: {type: string}
        label: {type: [string, "null"]}
        nominal_roll_id: {type: string}
        remarks: {type: [string, "null"]}
        entries:
          type: array
          items: {$ref: "#/components/schemas/TaggingEntryResponse"}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: [string, "null"], format: date-time}
        updated_by: {type: [string, "null"]}

    TaggingCloneRequest:
      type: object
      required: [target_nominal_roll_id]
      properties:
        target_nominal_roll_id: {type: string}

    TaggingCloneResponse:
      type: object
      properties:
        tagging: {$ref: "#/components/schemas/TaggingResponse"}
        source_count: {type: integer}
        matched_count: {type: integer}
        unmatched:
          type: array
          items:
            type: object
            properties:
              pers_no: {type: string}
              name: {type: [string, "null"]}

    # ----- deferments ------------------------------------------------------
    DefermentReason:
      type: string
      enum:
        - Honeymoon
        - Work
        - Full-time studies
        - Other
        - Medical Grounds
        - Examination
        - New employment
        - Special employment
        - Compassionate
        - Childbirth
        - Part-time studies
        - Newly Established Business (Local)

    DefermentStatus:
      type: string
      enum:
        - Approved
        - Withdrawn
        - Rejected
        - To Resubmit
        - Time off arrangement
        - Pending action
        - Not called up
        - Do not call up

    DefermentCreate:
      type: object
      required: [personnel_id, reason]
      properties:
        personnel_id: {type: string}
        reason: {$ref: "#/components/schemas/DefermentReason"}
        remarks: {type: [string, "null"]}
        oc_updates: {type: [string, "null"]}

    DefermentUpdate:
      type: object
      properties:
        reason: {$ref: "#/components/schemas/DefermentReason"}
        status: {$ref: "#/components/schemas/DefermentStatus"}
        remarks: {type: [string, "null"]}
        oc_updates: {type: [string, "null"]}

    DefermentResponse:
      type: object
      properties:
        id: {type: string}
        personnel_id: {type: string}
        nominal_roll_id: {type: [string, "null"]}
        rank_name: {type: string}
        sub_unit: {type: [string, "null"]}
        reason: {type: string}
        status: {type: string}
        remarks: {type: [string, "null"]}
        oc_updates: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: [string, "null"], format: date-time}
        updated_by: {type: [string, "null"]}

    # ----- discussions -----------------------------------------------------
    DiscussionPostResponse:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        body: {type: string}
        author_id: {type: string}
        author_name: {type: [string, "null"]}
        category: {type: string, enum: [requests, bugs]}
        status: {type: string, enum: [Open, Duplicate, Accepted, Implemented, Closed]}
        comment_count: {type: integer}
        created_at: {type: string, format: date-time}
        edited_at: {type: [string, "null"], format: date-time}

    DiscussionPostDetailResponse:
      allOf:
        - {$ref: "#/components/schemas/DiscussionPostResponse"}
        - type: object
          properties:
            comments:
              type: array
              items: {$ref: "#/components/schemas/DiscussionCommentResponse"}

    DiscussionPostCreate:
      type: object
      required: [title, body, category]
      properties:
        title: {type: string, maxLength: 200}
        body: {type: string}
        category: {type: string, enum: [requests, bugs]}

    DiscussionPostUpdate:
      type: object
      properties:
        title: {type: [string, "null"], maxLength: 200}
        body: {type: [string, "null"]}

    DiscussionPostTriage:
      type: object
      properties:
        category: {type: [string, "null"], enum: [requests, bugs, null]}
        status: {type: [string, "null"], enum: [Open, Duplicate, Accepted, Implemented, Closed, null]}

    DiscussionCommentResponse:
      type: object
      properties:
        id: {type: string}
        post_id: {type: string}
        author_id: {type: string}
        author_name: {type: [string, "null"]}
        body: {type: string}
        created_at: {type: string, format: date-time}
        edited_at: {type: [string, "null"], format: date-time}

    DiscussionCommentCreate:
      type: object
      required: [body]
      properties:
        body: {type: string}

    DiscussionCommentUpdate:
      type: object
      required: [body]
      properties:
        body: {type: string}

    # ----- access control --------------------------------------------------
    SubunitAssignmentCreate:
      type: object
      required: [sub_unit_1]
      properties:
        unit: {type: string, default: "*", description: '"*" = any unit.'}
        sub_unit_1: {type: string, description: '"*" = every sub-unit of the unit.'}

    SubunitAssignmentResponse:
      type: object
      properties:
        id: {type: string}
        user_id: {type: string}
        nominal_roll_id: {type: string}
        unit: {type: string}
        sub_unit_1: {type: string}
        created_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_at: {type: string, format: date-time}
        nominal_roll_label: {type: [string, "null"]}

    # ----- csv -------------------------------------------------------------
    CsvUploadResponse:
      type: object
      properties:
        id: {type: string}
        sha256_hash: {type: string}
        original_filename: {type: [string, "null"]}
        line_count: {type: integer}
        detected_columns:
          type: array
          items: {type: string}
        status: {type: string}
        uploaded_at: {type: string, format: date-time}
        uploaded_by: {type: string}
        is_duplicate: {type: boolean}
        process_result:
          oneOf:
            - {$ref: "#/components/schemas/CsvProcessResponse"}
            - type: "null"
          description: Set only with auto_process=true on success.
        process_error: {type: [string, "null"]}

    CsvUploadListItem:
      type: object
      properties:
        id: {type: string}
        sha256_hash: {type: string}
        original_filename: {type: [string, "null"]}
        line_count: {type: integer}
        status: {type: string}
        uploaded_at: {type: string, format: date-time}
        uploaded_by: {type: string}
        nominal_roll_id: {type: [string, "null"]}
        mapping_confirmed_at: {type: [string, "null"], format: date-time}
        diff_confirmed_at: {type: [string, "null"], format: date-time}

    CsvProcessRequest:
      type: object
      properties:
        source_nominal_roll_id:
          type: [string, "null"]
          description: Copy this NR's tagging entries into the new tagging by pers_no.

    CsvProcessResponse:
      type: object
      properties:
        nominal_roll_id: {type: string}
        personnel_inserted: {type: integer}
        rows_skipped: {type: integer, description: Non-Yes decisions + unrecognized ranks.}
        decision_skipped: {type: integer}
        tagging_entries_imported: {type: integer}
        unmatched:
          type: array
          items:
            type: object
            properties:
              pers_no: {type: string}
              name: {type: [string, "null"]}

    # ----- groupings -------------------------------------------------------
    GroupingGroupItem:
      type: object
      required: [label]
      properties:
        id: {type: [string, "null"], description: Existing id renames in place; absent ids in an update are removals.}
        label: {type: string, maxLength: 100}

    GroupingCreate:
      type: object
      required: [label]
      properties:
        label: {type: string, maxLength: 100}
        groups:
          type: array
          items: {$ref: "#/components/schemas/GroupingGroupItem"}
        multiple_membership: {type: boolean, default: false}
        allow_ungrouped: {type: boolean, default: true}

    GroupingUpdate:
      type: object
      properties:
        label: {type: [string, "null"], maxLength: 100}
        groups:
          type: [array, "null"]
          items: {$ref: "#/components/schemas/GroupingGroupItem"}
        multiple_membership: {type: [boolean, "null"], description: Immutable — 400 on change.}
        allow_ungrouped: {type: [boolean, "null"], description: Immutable — 400 on change.}

    GroupingGroupResponse:
      type: object
      properties:
        id: {type: string}
        label: {type: string}
        position: {type: integer}
        member_count: {type: integer}

    GroupingResponse:
      type: object
      properties:
        id: {type: string}
        label: {type: string}
        nominal_roll_id: {type: string}
        multiple_membership: {type: boolean}
        allow_ungrouped: {type: boolean}
        groups:
          type: array
          items: {$ref: "#/components/schemas/GroupingGroupResponse"}
        created_at: {type: string, format: date-time}
        created_by: {type: string}

    MembershipSetRequest:
      type: object
      properties:
        group_ids:
          type: array
          items: {type: string}

    MemberStateUpdate:
      type: object
      properties:
        checkbox: {type: [boolean, "null"]}
        remarks: {type: [string, "null"], description: Empty string clears.}

    GroupingCloneRequest:
      type: object
      required: [label]
      properties:
        label: {type: string, maxLength: 100}
        include_memberships: {type: boolean, default: false}

    GroupingCopyRequest:
      type: object
      required: [source_grouping_id]
      properties:
        source_grouping_id: {type: string}
        label: {type: [string, "null"], description: Defaults to the source label.}

    # ----- audit -----------------------------------------------------------
    AuditLogListItem:
      type: object
      properties:
        id: {type: string}
        timestamp: {type: string, format: date-time}
        user_id: {type: [string, "null"]}
        user_name: {type: [string, "null"]}
        user_email: {type: [string, "null"]}
        entity_type: {type: string}
        entity_id: {type: string}
        action: {type: string}
        changes: {type: [string, "null"]}
        description: {type: string}
        ip_address: {type: [string, "null"]}

    AuditLogListResponse:
      type: object
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/AuditLogListItem"}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}

    # ----- feature access --------------------------------------------------
    FeatureAccessUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [feature_key, enabled]
            properties:
              feature_key:
                type: string
                enum: [upload_nr, nominal_roll, attendance, strength, grouping, deferments, discussions]
              enabled: {type: boolean}

    FeatureAccessResponse:
      type: object
      properties:
        role: {type: string, example: admin}
        features:
          type: object
          additionalProperties: {type: boolean}

security:
  - bearerAuth: []
