# Pre-commit hooks for Parade State
# Install: pip install pre-commit
# Setup: pre-commit install
# Skip: git commit --no-verify

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Run the formatter only (handles import sorting, line length, whitespace, etc)
      # Does NOT remove unused imports - safe for intermediate commits
      - id: ruff-format
        args: [--config=pyproject.toml]