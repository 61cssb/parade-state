# Pre-commit hooks for Parade State
# Install: pip install pre-commit
# Setup: pre-commit install
# Skip: git commit --no-verify
#
# The ruff rev matches the ruff version resolved in uv.lock — bump both
# together so local hooks and CI format identically.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      # Lint with autofix (unused imports, import sorting, etc)
      - id: ruff
        args: [--fix, --config=pyproject.toml]
      # Run the formatter (line length, whitespace, string quotes, etc)
      - id: ruff-format
        args: [--config=pyproject.toml]
