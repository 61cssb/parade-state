[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parade-state"
version = "0.1.0"
description = "Battalion Parade State Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "authlib>=1.3.0",
    "nicegui>=1.4.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "starlette>=0.27.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
    "faker>=20.0.0",
    "python-dotenv>=1.2.2",
    "markdown2>=2.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pre-commit>=3.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parade_state"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/parade_state",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/parade_state"]
omit = [
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    # High-noise, low-benefit rules (disabled for better signal-to-noise ratio)
    "B017",  # blind exception catching in tests - validates business logic, not implementation details
    "ARG001", # unused arguments - FastAPI patterns, reserved params, stub functions
    "UP017", # timezone.utc → UTC - cosmetic modernization, minimal benefit
    "UP007", # Union[X, Y] → X | Y - minor readability improvement
    "UP035", # typing → collections.abc imports - minimal benefit
    # Code simplification rules that reduce readability
    "SIM102", # Use single if instead of nested if (reduces clarity)
    "SIM108", # Use ternary operator instead of if-else (less readable)
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "ARG",  # unused arguments are common in test fixtures
    "SIM",  # simplification can make tests less readable
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/migrations/**"
]
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "error"
reportUnusedCallResult = "none"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
strictParameterNoneValue = true
pythonVersion = "3.12"
pythonPlatform = "Linux"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
]
